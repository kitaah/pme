server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # En-tetes de securite declares au niveau du serveur, donc appliques a toutes les reponses.
  # Les blocs "location" ci-dessous regient le cache avec "expires" et non avec "add_header",
  # sinon ils perdraient ces trois en-tetes (nginx n'herite pas des "add_header" d'un niveau superieur).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # ---- Compression ----
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # ---- Site statique MkDocs ----
  # Les pages sont des dossiers contenant un index.html (use_directory_urls) : /pipeline/ sert /pipeline/index.html.
  location / {
    try_files $uri $uri/ =404;
  }

  # MkDocs genere une page 404.html avec le theme du site.
  error_page 404 /404.html;

  # Le site est reconstruit a chaque version de l'image : cache court pour les ressources.
  location /assets/ {
    expires 1h;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }
}