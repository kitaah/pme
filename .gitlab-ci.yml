# Chaine CI/CD (GitLab CI) - tests unitaires (api, moderation-service, libs/common, frontend), analyse SonarCloud, controle des Dockerfile (Hadolint), tests d'integration, analyse des dependances, tests des images Docker (puis leur publication), tests de performance.
# Les autres etapes (qualite statique) seront ajoutees une a une.
# Tous les jobs sont independants (needs: []) : la duree du pipeline est celle du job le plus long.
# Quota GitLab gratuit : 400 minutes de pipeline par mois. Tous les jobs tournent a chaque pipeline (demonstration complete).
# Objectif : pipeline sous 5 minutes. GitLab ne plafonne pas un pipeline entier : chaque job est donc limite a 5 minutes
# et n'est relance qu'en cas de panne du runner (pas apres un depassement de delai).
stages: [test, quality, integration, image, performance]

# Pipeline limite pour l'instant a la branche principale.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:24-alpine
  interruptible: true # un nouveau commit annule le pipeline devenu obsolete
  timeout: 5 minutes
  retry:
    max: 1
    when: [runner_system_failure, api_failure]

variables:
  GIT_DEPTH: "1" # seul le dernier commit est utile aux tests
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_audit: "false"
  npm_config_fund: "false"
  # Archives de cache et d'artefacts : compression rapide plutot que compacte.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest

# ---------- Tests unitaires : un job par module, execute en parallele ----------
# Chaque job publie son rapport de tests (onglet « Tests » de la MR) et sa couverture (lignes couvertes dans le diff de la MR).
# Les seuils de couverture sont dans jest.config.js et vite.config.ts : le job echoue s'ils ne sont pas atteints.
.unit-tests:
  stage: test
  needs: []
  # api, moderation-service et libs/common sont des workspaces npm : un seul npm ci, a la racine (package-lock.json commun).
  # Le frontend a son propre package.json. Les modules qui dependent de @pme/common le compilent via leur script "pretest:cov".
  before_script:
    - |
      if [ "$MODULE" = "frontend" ]; then
        (cd frontend && npm ci --prefer-offline)
      else
        npm ci --prefer-offline --workspace="$MODULE" --workspace=libs/common
      fi
    - cd "$MODULE"
  script:
    - npm run test:cov -- $TEST_ARGS
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 1 week
    # Uniquement les fichiers utiles : le rapport HTML de lcov compte des centaines de fichiers a envoyer.
    paths: ["$MODULE/coverage/lcov.info"]
    reports:
      junit: "$MODULE/reports/junit.xml"
      coverage_report:
        coverage_format: cobertura
        path: "$MODULE/coverage/cobertura-coverage.xml"

# Cache des paquets npm des workspaces : un seul, partage par les jobs de api, moderation-service et libs/common.
.backend-cache:
  cache:
    key: { prefix: backend, files: [package-lock.json] }
    paths: [.npm]

unit-tests:common:
  extends: [.unit-tests, .backend-cache]
  variables:
    MODULE: libs/common
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit.xml
    TEST_ARGS: --reporters=default --reporters=jest-junit

unit-tests:api:
  extends: [.unit-tests, .backend-cache]
  variables:
    MODULE: api
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit.xml
    TEST_ARGS: --reporters=default --reporters=jest-junit

unit-tests:moderation-service:
  extends: [.unit-tests, .backend-cache]
  variables:
    MODULE: moderation-service
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit.xml
    TEST_ARGS: --reporters=default --reporters=jest-junit

unit-tests:frontend:
  extends: .unit-tests
  variables:
    MODULE: frontend
    TEST_ARGS: --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  cache:
    key: { prefix: frontend, files: [frontend/package-lock.json] }
    paths: [.npm]

# ---------- Analyse SonarCloud : qualite et securite du code, couverture des tests unitaires ----------
# Lit les rapports de couverture produits par les tests unitaires (artefacts) et attend la porte qualite (sonar.qualitygate.wait).
# Variables CI/CD a definir dans le projet : SONAR_TOKEN (masquee) et SONAR_HOST_URL (https://sonarcloud.io).
# L'offre gratuite de SonarCloud n'analyse que la branche principale
# (« Organization is not allowed to access data from non main branches »).
sonar:
  stage: quality
  image: { name: sonarsource/sonar-scanner-cli:11, entrypoint: [""] }
  needs: ["unit-tests:common", "unit-tests:api", "unit-tests:moderation-service", "unit-tests:frontend"]
  variables:
    GIT_DEPTH: "0" # historique complet : Sonar en a besoin pour reperer le « nouveau code »
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # cache de l'analyseur entre deux pipelines
  cache:
    key: sonar
    paths: [.sonar/cache]
  before_script:
    # Les rapports lcov nomment les fichiers depuis leur module (src/...) : Sonar, lui, part de la racine du depot (libs/common/src/..., api/src/...).
    - |
      for module in libs/common api moderation-service frontend; do
        sed -i "s#^SF:src/#SF:${module}/src/#" "${module}/coverage/lcov.info"
      done
  script: [sonar-scanner]
  # Temporaire : la porte qualite de SonarCloud exige 80 % de couverture sur le code nouveau, bien plus que nos seuils.
  # Retirer cette ligne une fois la porte qualite reglee.
  allow_failure: true

# ---------- Controle des Dockerfile : Hadolint (linter, sans Docker ni construction d'image) ----------
# Regles et seuil d'echec (warning) definis dans .hadolint.yaml, partage avec `make lint-docker`.
hadolint:
  stage: test
  needs: []
  image: alpine:3.22
  variables:
    HADOLINT_VERSION: 2.14.0
    HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
  before_script:
    - apk add --no-cache curl
    # Hadolint : version epinglee et binaire verifie par sa somme de controle (SHA-256) avant installation.
    - curl -sSfL -o /usr/local/bin/hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
    - echo "${HADOLINT_SHA256}  /usr/local/bin/hadolint" | sha256sum -c -
    - chmod +x /usr/local/bin/hadolint
  script:
    - hadolint --version
    - hadolint --config .hadolint.yaml --no-color api/Dockerfile moderation-service/Dockerfile frontend/Dockerfile docker/docs/Dockerfile

# ---------- Analyse des dependances : failles connues dans les fichiers package-lock.json (Trivy) ----------
# Complete l'analyse des images : celle-ci ne voit que les paquets de production, alors que cette analyse lit aussi les
# devDependencies (outils de build et de test). Pas de Docker ici : Trivy lit directement les fichiers du depot, le job est court.
# Meme regles que l'analyse des images : HIGH et CRITICAL, failles corrigeables seulement, exceptions dans .trivyignore.
# Lance a chaque pipeline.
dependency-scan:
  stage: quality
  needs: []
  image: alpine:3.22
  variables:
    TRIVY_VERSION: 0.71.2
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  before_script:
    - apk add --no-cache curl
    # Trivy : version epinglee et archive verifiee par sa somme de controle (SHA-256) avant installation.
    - |
      (
        cd /tmp
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfLO "$base/$archive"
        curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        grep " $archive\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "$archive" -C /usr/local/bin trivy
      )
  script:
    # 1. Analyse du depot : package-lock.json de la racine (api, moderation-service, libs/common) et du frontend, devDependencies comprises.
    - trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-dependencies.json --exit-code 0 .
    # 2. Lecture du rapport : tableau dans le journal, et echec s'il reste une faille HIGH ou CRITICAL non justifiee (.trivyignore).
    - trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-dependencies.json
  artifacts:
    when: always
    expire_in: 1 week
    paths: [trivy-dependencies.json]

# ---------- Analyse des images d'Istio : failles connues dans istiod, istio-cni et ztunnel (Trivy) ----------
# istio-cni et ztunnel s'executent avec des droits eleves sur le noeud : leurs images sont analysees comme celles du projet.
# Ces images sont publiees par Istio et ne sont pas reconstruites ici : le correctif d'une faille vient d'une nouvelle version
# d'Istio. Le job bloque donc sur les failles CRITICAL corrigeables, et signale les HIGH (nombre dans le journal, detail dans
# les rapports JSON) pour decider d'une montee de version. Les exceptions restent dans .trivyignore.
# Meme installation de Trivy que dependency-scan (job dont celui-ci herite). La version d'Istio est lue dans le Makefile
# (ISTIO_VERSION) : une seule source. Lance a chaque pipeline.
istio-scan:
  extends: dependency-scan
  script:
    - ISTIO_VERSION=$(sed -n 's/^ISTIO_VERSION ?= *//p' Makefile)
    - test -n "$ISTIO_VERSION"
    # 1. Analyse des trois images (HIGH et CRITICAL corrigeables), un rapport JSON par image, sans echec a ce stade.
    - |
      for img in pilot install-cni ztunnel; do
        trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-istio-$img.json" --exit-code 0 "docker.io/istio/$img:$ISTIO_VERSION"
      done
    # 2. Nombre de failles HIGH par image : information, pas un echec.
    - |
      for img in pilot install-cni ztunnel; do
        echo "$img:$ISTIO_VERSION : $(grep -c '"Severity": "HIGH"' "trivy-istio-$img.json") failles HIGH corrigeables (voir le rapport trivy-istio-$img.json)"
      done
    # 3. Echec s'il reste une faille CRITICAL corrigeable non justifiee (.trivyignore).
    - |
      failed=""
      for img in pilot install-cni ztunnel; do
        trivy convert --format table --severity CRITICAL --exit-code 1 "trivy-istio-$img.json" || failed=1
      done
      test -z "$failed"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [trivy-istio-pilot.json, trivy-istio-install-cni.json, trivy-istio-ztunnel.json]

# ---------- Tests d'integration : PostgreSQL et NATS (JetStream) reels, lances par Testcontainers ----------
# Testcontainers a besoin d'un demon Docker : service Docker-in-Docker, detruit avec le job.
# Un seul job pour l'API et la moderation : le demarrage de Docker-in-Docker (~40 s facturees) n'est paye qu'une fois.
# Les deux modules sont testes meme si le premier echoue, puis le job echoue si l'un d'eux a echoue.
integration-tests:
  stage: integration
  needs: []
  services:
    - name: docker:27-dind
      # Les images Docker Hub (postgres, nats) passent par le miroir de Google : telechargement plus rapide, sans limite de debit.
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Les conteneurs de test sont publies sur l'hote Docker (le service dind), pas sur localhost.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Inutile ici : le service dind est supprime a la fin du job, avec tous ses conteneurs.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit-integration.xml
  cache:
    key: { prefix: backend, files: [package-lock.json] }
    paths: [.npm]
    policy: pull
  script:
    - npm ci --prefer-offline --workspace=api --workspace=moderation-service --workspace=libs/common
    - |
      status=0
      for module in api moderation-service; do
        (cd "$module" && npm run test:integration -- --forceExit --reporters=default --reporters=jest-junit) || status=1
      done
      exit $status
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: ["api/reports/junit-integration.xml", "moderation-service/reports/junit-integration.xml"]

# ---------- Tests des images Docker : construction, structure (container-structure-test), vulnerabilites (Trivy), publication ----------
# Un seul job, un seul Docker-in-Docker : les trois images sont construites en parallele (docker-bake.hcl),
# puis la structure et les vulnerabilites sont controlees. Memes controles que "make image-test".
# Publication dans le registre de conteneurs GitLab en derniere etape : seulement si tous les controles ont reussi
# (le script s'arrete a la premiere etape en echec) et seulement sur la branche principale. Une image n'est donc
# jamais publiee sans avoir ete controlee. Pas de nouvelle construction : ce sont les images deja testees.
# Job couteux, lance a chaque pipeline. Le cache de couches (registre) en limite la duree.
image-tests:
  stage: image
  needs: []
  image: docker:27
  timeout: 6 minutes # plafond maximal du projet pour un job ; un pipeline normal (cache de construction rempli) reste sous 5 minutes
  services:
    - name: docker:27-dind
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TAG: "ci-$CI_COMMIT_SHORT_SHA"
    CACHE_REPO: "$CI_REGISTRY_IMAGE/cache"
    CST_VERSION: v1.19.3
    TRIVY_VERSION: 0.71.2
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    # Base de vulnerabilites : miroir AWS en premier (la limite de debit de ghcr.io fait echouer des scans).
    TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  before_script:
    - apk add --no-cache curl
    # container-structure-test et Trivy : versions epinglees, binaires verifies par leur somme de controle (SHA-256).
    # Les deux telechargements se font en parallele.
    - |
      install_cst() (
        set -e; cd /tmp
        base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
        curl -sSfLO "$base/container-structure-test-linux-amd64"
        curl -sSfLO "$base/checksums.txt"
        grep " container-structure-test-linux-amd64\$" checksums.txt | sha256sum -c -
        install -m 0755 container-structure-test-linux-amd64 /usr/local/bin/cst
      )
      install_trivy() (
        set -e; cd /tmp
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfLO "$base/$archive"
        curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        grep " $archive\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "$archive" -C /usr/local/bin trivy
      )
      install_cst & cst_pid=$!
      install_trivy & trivy_pid=$!
      wait $cst_pid && wait $trivy_pid
  script:
    # 1. Construction des trois images en parallele. Le cache de couches vit dans le registre GitLab (voir docker-bake.hcl) :
    #    il demande un builder docker-container, donc `--load` pour retrouver les images dans le Docker du job.
    #    La connexion au registre se fait avant : elle sert au cache et, plus bas, a la publication.
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    #    La base Trivy se telecharge en arriere-plan pendant la construction (reseau libre, CPU peu utilise).
    - docker buildx create --name pme-ci --driver docker-container --use
    - trivy image --download-db-only > trivy-db.log 2>&1 & echo $! > trivy-db.pid
    - docker buildx bake --load
    - wait "$(cat trivy-db.pid)" || { cat trivy-db.log; exit 1; }
    # 2. Structure de chaque image
    #    Les trois controles tournent en parallele ; le job echoue si l'un d'eux echoue.
    - |
      for svc in api moderation frontend; do
        cst test --image "pme-$svc:$TAG" --config "tests/image/$svc.yaml" > "cst-$svc.log" 2>&1 & echo $! > "cst-$svc.pid"
      done
      status=0
      for svc in api moderation frontend; do
        wait "$(cat "cst-$svc.pid")" || status=1
        echo "== structure pme-$svc"; cat "cst-$svc.log"
      done
      exit $status
    # 3. Vulnerabilites : base telechargee une fois, puis les trois analyses en parallele (vulnerabilites des paquets uniquement,
    #    failles sans correctif ignorees). Un rapport JSON par image est conserve en artefact.
    - printf '%s\n' api moderation frontend | xargs -P 3 -I{} trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-{}.json" --exit-code 0 "pme-{}:$TAG"
    # 4. Lecture des rapports : tableau dans le journal, et echec s'il reste une faille HIGH ou CRITICAL non justifiee (.trivyignore).
    - |
      status=0
      for svc in api moderation frontend; do
        echo "== pme-$svc"
        trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 "trivy-$svc.json" || status=1
      done
      exit $status
    # 5. Publication dans le registre GitLab (branche principale uniquement).
    #    Etiquette immuable : le commit (pas de "latest"). Les trois envois se font en parallele.
    #    CI_REGISTRY_USER et CI_REGISTRY_PASSWORD sont fournis par GitLab pour la duree du job.
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        for svc in api moderation frontend; do
          docker tag "pme-$svc:$TAG" "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA"
        done
        printf '%s\n' api moderation frontend | xargs -P 3 -I{} docker push "$CI_REGISTRY_IMAGE/{}:$CI_COMMIT_SHORT_SHA"
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths: ["trivy-*.json"]

# ---------- Tests de performance : l'API reelle, PostgreSQL et NATS, mesures par k6 ----------
# Pas de Docker-in-Docker ni de Keycloak : PostgreSQL et NATS sont des services GitLab, et un faux fournisseur d'identite
# signe le jeton (voir scripts/perf-ci.sh). Le test echoue si un seuil k6 est depasse (tests/performance/load.js).
# La charge complete (20 utilisateurs, Keycloak reel) reste a lancer sur l'environnement de recette.
performance-tests:
  stage: performance
  needs: []
  services:
    - name: postgres:18-alpine
      alias: postgres
    - name: nats:2.14-alpine
      alias: nats
      # JetStream active, avec les identifiants de NATS_USER et NATS_PASSWORD ci-dessous.
      command: ["-js", "--user", "pme", "--pass", "ci"]
  variables:
    K6_VERSION: 1.4.0
    # Service PostgreSQL
    POSTGRES_DB: pme
    POSTGRES_USER: pme
    POSTGRES_PASSWORD: ci
    # Configuration de l'API (valeurs jetables : les services disparaissent avec le job)
    DB_HOST: postgres
    DB_NAME: pme
    DB_USER: pme
    DB_PASSWORD: ci
    NATS_HOST: nats
    NATS_USER: pme
    NATS_PASSWORD: ci
  cache:
    key: { prefix: backend, files: [package-lock.json] }
    paths: [.npm]
    policy: pull
  before_script:
    - apk add --no-cache curl
    # k6 : version epinglee et archive verifiee par sa somme de controle (SHA-256) avant installation.
    - |
      (
        cd /tmp
        base="https://github.com/grafana/k6/releases/download/v${K6_VERSION}"
        archive="k6-v${K6_VERSION}-linux-amd64.tar.gz"
        curl -sSfLO "$base/$archive"
        curl -sSfLO "$base/k6-v${K6_VERSION}-checksums.txt"
        grep " $archive\$" "k6-v${K6_VERSION}-checksums.txt" | sha256sum -c -
        tar -xzf "$archive"
        install -m 0755 "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
      )
  script:
    - sh scripts/perf-ci.sh
  artifacts:
    when: always
    expire_in: 1 week
    # Sans token.txt : le jeton de test n'a rien a faire dans un artefact.
    paths: ["perf-results/summary.json", "perf-results/api.log", "perf-results/environment.log"]