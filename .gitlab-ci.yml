# Chaine CI/CD (GitLab CI) - tests unitaires, analyse SonarCloud, tests d'integration, tests des images Docker, tests de performance.
# Les autres etapes (qualite statique, securite) seront ajoutees une a une.
# Tous les jobs sont independants (needs: []) : la duree du pipeline est celle du job le plus long.
# Quota GitLab gratuit : 400 minutes de pipeline par mois. Peu de jobs, et un job ne tourne que si son code change.
# Objectif : pipeline sous 5 minutes. GitLab ne plafonne pas un pipeline entier : chaque job est donc limite a 5 minutes
# et n'est relance qu'en cas de panne du runner (pas apres un depassement de delai).
stages: [test, quality, integration, image, performance]

# Pipeline limite pour l'instant a la branche principale.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:24-alpine
  interruptible: true # un nouveau commit annule le pipeline devenu obsolete
  timeout: 5 minutes
  retry:
    max: 1
    when: [runner_system_failure, api_failure]

variables:
  GIT_DEPTH: "1" # seul le dernier commit est utile aux tests
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  npm_config_audit: "false"
  npm_config_fund: "false"
  # Archives de cache et d'artefacts : compression rapide plutot que compacte.
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: fastest
  ARTIFACT_COMPRESSION_LEVEL: fastest

# Declencheur commun des tests unitaires et de l'analyse Sonar : un changement de code dans l'un des trois modules.
# Les trois modules sont testes ensemble : Sonar a besoin de la couverture des trois pour ne pas la compter a 0 %.
.code-changes:
  rules:
    - changes: [".gitlab-ci.yml", "sonar-project.properties", "api/**/*", "moderation-service/**/*", "frontend/**/*"]

# ---------- Tests unitaires : un job par module, execute en parallele ----------
# Les jobs ne tournent que si le code change : un commit de documentation ne coute aucune minute.
# Chaque job publie son rapport de tests (onglet « Tests » de la MR) et sa couverture (lignes couvertes dans le diff de la MR).
# Les seuils de couverture sont dans jest.config.js et vite.config.ts : le job echoue s'ils ne sont pas atteints.
.unit-tests:
  stage: test
  needs: []
  before_script:
    - cd "$MODULE"
    - npm ci --prefer-offline
  script:
    - npm run test:cov -- $TEST_ARGS
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 1 week
    # Uniquement les fichiers utiles : le rapport HTML de lcov compte des centaines de fichiers a envoyer.
    paths: ["$MODULE/coverage/lcov.info"]
    reports:
      junit: "$MODULE/reports/junit.xml"
      coverage_report:
        coverage_format: cobertura
        path: "$MODULE/coverage/cobertura-coverage.xml"

unit-tests:api:
  extends: .unit-tests
  variables:
    MODULE: api
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit.xml
    TEST_ARGS: --reporters=default --reporters=jest-junit
  cache:
    key: { prefix: api, files: [api/package-lock.json] }
    paths: [.npm]
  rules: !reference [.code-changes, rules]

unit-tests:moderation-service:
  extends: .unit-tests
  variables:
    MODULE: moderation-service
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit.xml
    TEST_ARGS: --reporters=default --reporters=jest-junit
  cache:
    key: { prefix: moderation-service, files: [moderation-service/package-lock.json] }
    paths: [.npm]
  rules: !reference [.code-changes, rules]

unit-tests:frontend:
  extends: .unit-tests
  variables:
    MODULE: frontend
    TEST_ARGS: --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  cache:
    key: { prefix: frontend, files: [frontend/package-lock.json] }
    paths: [.npm]
  rules: !reference [.code-changes, rules]

# ---------- Analyse SonarCloud : qualite et securite du code, couverture des tests unitaires ----------
# Lit les rapports de couverture produits par les tests unitaires (artefacts) et attend la porte qualite (sonar.qualitygate.wait).
# Variables CI/CD a definir dans le projet : SONAR_TOKEN (masquee) et SONAR_HOST_URL (https://sonarcloud.io).
# L'offre gratuite de SonarCloud n'analyse que la branche principale
# (« Organization is not allowed to access data from non main branches »).
sonar:
  stage: quality
  image: { name: sonarsource/sonar-scanner-cli:11, entrypoint: [""] }
  needs: ["unit-tests:api", "unit-tests:moderation-service", "unit-tests:frontend"]
  variables:
    GIT_DEPTH: "0" # historique complet : Sonar en a besoin pour reperer le « nouveau code »
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar" # cache de l'analyseur entre deux pipelines
  cache:
    key: sonar
    paths: [.sonar/cache]
  before_script:
    # Les rapports lcov nomment les fichiers depuis leur module (src/...) : Sonar, lui, part de la racine du depot (api/src/...).
    - |
      for module in api moderation-service frontend; do
        sed -i "s#^SF:src/#SF:${module}/src/#" "${module}/coverage/lcov.info"
      done
  script: [sonar-scanner]
  # Temporaire : la porte qualite de SonarCloud exige 80 % de couverture sur le code nouveau, bien plus que nos seuils.
  # Retirer cette ligne une fois la porte qualite reglee.
  allow_failure: true
  rules: !reference [.code-changes, rules]

# ---------- Tests d'integration : PostgreSQL et NATS (JetStream) reels, lances par Testcontainers ----------
# Testcontainers a besoin d'un demon Docker : service Docker-in-Docker, detruit avec le job.
# Un seul job pour l'API et la moderation : le demarrage de Docker-in-Docker (~40 s facturees) n'est paye qu'une fois.
# Les deux modules sont testes meme si le premier echoue, puis le job echoue si l'un d'eux a echoue.
integration-tests:
  stage: integration
  needs: []
  services:
    - name: docker:27-dind
      # Les images Docker Hub (postgres, nats) passent par le miroir de Google : telechargement plus rapide, sans limite de debit.
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Les conteneurs de test sont publies sur l'hote Docker (le service dind), pas sur localhost.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Inutile ici : le service dind est supprime a la fin du job, avec tous ses conteneurs.
    TESTCONTAINERS_RYUK_DISABLED: "true"
    JEST_JUNIT_OUTPUT_DIR: reports
    JEST_JUNIT_OUTPUT_NAME: junit-integration.xml
  cache:
    - key: { prefix: api, files: [api/package-lock.json] }
      paths: [.npm]
      policy: pull
    - key: { prefix: moderation-service, files: [moderation-service/package-lock.json] }
      paths: [.npm]
      policy: pull
  script:
    - |
      status=0
      for module in api moderation-service; do
        (cd "$module" && npm ci --prefer-offline && npm run test:integration -- --forceExit --reporters=default --reporters=jest-junit) || status=1
      done
      exit $status
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: ["api/reports/junit-integration.xml", "moderation-service/reports/junit-integration.xml"]
  rules:
    - changes: [".gitlab-ci.yml", "api/**/*", "moderation-service/**/*"]

# ---------- Tests des images Docker : construction, structure (container-structure-test), vulnerabilites (Trivy) ----------
# Un seul job, un seul Docker-in-Docker : les trois images sont construites en parallele (docker-bake.hcl),
# puis la structure et les vulnerabilites sont controlees. Memes controles que "make image-test".
# Job couteux : lance automatiquement seulement si le contenu d'une image ou ses tests changent, sinon a la demande.
image-tests:
  stage: image
  needs: []
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--registry-mirror", "https://mirror.gcr.io"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TAG: "ci-$CI_COMMIT_SHORT_SHA"
    CST_VERSION: v1.19.3
    TRIVY_VERSION: 0.71.2
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
    # Base de vulnerabilites : miroir AWS en premier (la limite de debit de ghcr.io fait echouer des scans).
    TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
    TRIVY_NO_PROGRESS: "true"
    TRIVY_SKIP_VERSION_CHECK: "true"
  cache:
    key: trivy-db
    paths: [.trivycache]
  rules:
    # Ce qui change le contenu d'une image ou sa securite : Dockerfile, dependances, configuration nginx, tests d'image, exceptions Trivy.
    - changes:
        - ".gitlab-ci.yml"
        - ".trivyignore"
        - "docker-bake.hcl"
        - "tests/image/**/*"
        - "*/Dockerfile"
        - "*/.dockerignore"
        - "*/package-lock.json"
        - "frontend/nginx.conf"
    - when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache curl
    # container-structure-test : version epinglee et binaire verifie par sa somme de controle (SHA-256) avant installation.
    - |
      (
        cd /tmp
        base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
        curl -sSfLO "$base/container-structure-test-linux-amd64"
        curl -sSfLO "$base/checksums.txt"
        grep " container-structure-test-linux-amd64\$" checksums.txt | sha256sum -c -
        install -m 0755 container-structure-test-linux-amd64 /usr/local/bin/cst
      )
    # Trivy : version epinglee et archive verifiee par sa somme de controle (SHA-256) avant installation.
    - |
      (
        cd /tmp
        base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
        archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        curl -sSfLO "$base/$archive"
        curl -sSfLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
        grep " $archive\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
        tar -xzf "$archive" -C /usr/local/bin trivy
      )
  script:
    # 1. Construction des trois images en parallele
    - docker buildx bake
    # 2. Structure de chaque image
    - |
      status=0
      for svc in api moderation frontend; do
        cst test --image "pme-$svc:$TAG" --config "tests/image/$svc.yaml" || status=1
      done
      exit $status
    # 3. Vulnerabilites : base telechargee une fois, puis les trois analyses en parallele (vulnerabilites des paquets uniquement,
    #    failles sans correctif ignorees). Un rapport JSON par image est conserve en artefact.
    - trivy image --download-db-only
    - printf '%s\n' api moderation frontend | xargs -P 3 -I{} trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-{}.json" --exit-code 0 "pme-{}:$TAG"
    # 4. Lecture des rapports : tableau dans le journal, et echec s'il reste une faille HIGH ou CRITICAL non justifiee (.trivyignore).
    - |
      status=0
      for svc in api moderation frontend; do
        echo "== pme-$svc"
        trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 "trivy-$svc.json" || status=1
      done
      exit $status
  artifacts:
    when: always
    expire_in: 1 week
    paths: ["trivy-*.json"]

# ---------- Tests de performance : l'API reelle, PostgreSQL et NATS, mesures par k6 ----------
# Pas de Docker-in-Docker ni de Keycloak : PostgreSQL et NATS sont des services GitLab, et un faux fournisseur d'identite
# signe le jeton (voir scripts/perf-ci.sh). Le test echoue si un seuil k6 est depasse (tests/performance/load.js).
# La charge complete (20 utilisateurs, Keycloak reel, preuve du decouplage) reste a lancer sur l'environnement de recette.
performance-tests:
  stage: performance
  needs: []
  services:
    - name: postgres:18-alpine
      alias: postgres
    - name: nats:2.14-alpine
      alias: nats
      # JetStream active, avec les identifiants de NATS_USER et NATS_PASSWORD ci-dessous.
      command: ["-js", "--user", "pme", "--pass", "ci"]
  variables:
    K6_VERSION: 1.4.0
    # Service PostgreSQL
    POSTGRES_DB: pme
    POSTGRES_USER: pme
    POSTGRES_PASSWORD: ci
    # Configuration de l'API (valeurs jetables : les services disparaissent avec le job)
    DB_HOST: postgres
    DB_NAME: pme
    DB_USER: pme
    DB_PASSWORD: ci
    NATS_HOST: nats
    NATS_USER: pme
    NATS_PASSWORD: ci
  cache:
    key: { prefix: api, files: [api/package-lock.json] }
    paths: [.npm]
    policy: pull
  before_script:
    - apk add --no-cache curl
    # k6 : version epinglee et archive verifiee par sa somme de controle (SHA-256) avant installation.
    - |
      (
        cd /tmp
        base="https://github.com/grafana/k6/releases/download/v${K6_VERSION}"
        archive="k6-v${K6_VERSION}-linux-amd64.tar.gz"
        curl -sSfLO "$base/$archive"
        curl -sSfLO "$base/k6-v${K6_VERSION}-checksums.txt"
        grep " $archive\$" "k6-v${K6_VERSION}-checksums.txt" | sha256sum -c -
        tar -xzf "$archive"
        install -m 0755 "k6-v${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
      )
  script:
    - sh scripts/perf-ci.sh
  artifacts:
    when: always
    expire_in: 1 week
    # Sans token.txt : le jeton de test n'a rien a faire dans un artefact.
    paths: ["perf-results/summary.json", "perf-results/api.log", "perf-results/environment.log"]
  rules:
    - changes: [".gitlab-ci.yml", "api/**/*", "tests/performance/**/*", "scripts/perf-ci.sh"]