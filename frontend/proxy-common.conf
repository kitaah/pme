# Reglages communs aux deux emplacements qui relaient vers un service applicatif.
# Inclus par nginx.conf ; copie a cote de lui dans l'image (voir Dockerfile).

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# L'API lit cet en-tete (Express "trust proxy") pour appliquer sa limite de debit
# par adresse reelle et non par adresse du pod nginx.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Transmet le protocole d'origine (https derriere l'ingress), pas celui de la liaison ingress -> nginx (http).
proxy_set_header X-Forwarded-Proto $forwarded_proto;

# Les services posent deja leurs propres en-tetes de securite (helmet). On les retire
# pour ne pas les dupliquer : ceux declares au niveau du serveur font autorite.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
