server {
  listen 8080;
  # N'indique plus la version de nginx dans les reponses et les pages d'erreur.
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # En-tetes de securite declares au niveau du serveur, donc appliques a toutes les reponses du front.
  # nginx n'herite les "add_header" d'un niveau superieur que si le bloc courant n'en declare aucun :
  # les blocs "location" ci-dessous regient donc le cache avec "expires" et non avec "add_header",
  # sinon ils perdraient ces en-tetes.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  # Le site n'utilise aucune de ces fonctions du navigateur : elles lui sont retirees, ainsi qu'a tout script injecte.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  # La page est isolee des fenetres d'autres sites : un site qui l'ouvrirait dans une fenetre ne peut pas la manipuler.
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Content-Security-Policy : liste blanche de ce que le navigateur a le droit de charger et de contacter.
  # Limite l'impact d'une injection de script (XSS) : un script venu d'ailleurs est refuse.
  #   default-src 'self'      : par defaut, uniquement l'origine du front (https://pme.localhost)
  #   script-src 'self'       : scripts du front et /config.js seulement, ni script inline ni eval
  #   style-src 'self'        : feuille de style Vite/Tailwind seulement, aucun style inline
  #   img-src 'self' data:    : favicon et images du front (data: pour les petites images integrees),
  #                             plus le stockage objet : les photos des annonces sont servies par
  #                             https://garage.localhost, par URL signee de courte duree
  #   connect-src             : appels reseau (fetch) vers l'API (meme origine) et vers Keycloak
  #   object-src 'none'       : aucun plugin (Flash, applet)
  #   base-uri 'self'         : empeche de changer l'adresse de base des liens relatifs
  #   form-action 'self'      : un formulaire ne peut etre envoye qu'a l'origine du front
  #   frame-ancestors 'none'  : le front ne peut etre integre dans aucune page tierce (equivalent moderne de X-Frame-Options)
  #   font-src 'self'         : la police Roboto est servie par le site (public/fonts), jamais par un service tiers
  # Les adresses de Keycloak et du stockage sont a changer avec config/frontend-config.js,
  # config/realm-pme.json et k8s/08-ingress.yaml.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://garage.localhost; font-src 'self'; connect-src 'self' https://keycloak.localhost; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # ---- Compression ----
  # Reduit fortement le poids des fichiers JavaScript et CSS du front.
  # Les images (PNG, JPEG, WebP) sont deja compressees : elles ne sont pas listees.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    image/svg+xml;

  # ---- Front seul ----
  # Ce serveur ne sert que les fichiers statiques. L'ingress achemine /api/v1 vers l'API et la moderation
  # (k8s/08-ingress.yaml) : le navigateur ne connait qu'une seule origine (https://pme.localhost), sans CORS.
  # Tout autre chemin /api (metriques, sondes) n'est jamais expose : reponse 404 plutot que index.html.
  location /api/ {
    return 404;
  }

  # config.js est remplace a l'execution par le ConfigMap : jamais servi depuis le cache
  location = /config.js {
    expires -1;
  }

  # Fichiers au nom versionne par Vite (index-<hash>.js, index-<hash>.css) : cache long
  location /assets/ {
    expires 1y;
  }

  # Police du site : fichiers stables, mis en cache longuement (sinon la regle `location /`
  # ci-dessous les ferait revalider a chaque page).
  location /fonts/ {
    expires 1y;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Application monopage : toute route inconnue rend index.html, qui doit toujours etre
  # revalide pour qu'un nouveau deploiement soit pris en compte sans vider le cache.
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
