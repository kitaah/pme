# Protocole d'origine de la requete : l'ingress termine le TLS et transmet X-Forwarded-Proto (https).
# Sans cet en-tete (appel direct au pod), on retombe sur le protocole de la connexion courante.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # En-tetes de securite declares au niveau du serveur, donc appliques a TOUTES les reponses,
  # y compris celles renvoyees par les deux services en amont.
  # nginx n'herite les "add_header" d'un niveau superieur que si le bloc courant n'en declare aucun :
  # les blocs "location" ci-dessous regient donc le cache avec "expires" et non avec "add_header",
  # sinon ils perdraient ces trois en-tetes.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # ---- Compression ----
  # Reduit fortement le poids des fichiers JavaScript, CSS et des reponses JSON de l'API.
  # Les images (PNG, JPEG, WebP) sont deja compressees : elles ne sont pas listees.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  # ---- Point d'entree unique ----
  # Ce serveur sert le front ET achemine les appels d'API vers les deux services.
  # Le navigateur ne connait donc qu'une seule origine (https://pme.localhost) : pas de CORS,
  # et le front appelle /api/... en relatif, en cluster comme en developpement local.
  # Le chemin le plus long l'emporte : la file de moderation part vers son propre service.
  # Les metriques ne sont lues que par Prometheus, a l'interieur du cluster : jamais exposees a l'exterieur.
  location = /api/metrics {
    return 404;
  }

  location /api/v1/moderation {
    proxy_pass http://pme-moderation:3001;
    include /etc/nginx/conf.d/proxy-common.conf;
  }

  location /api {
    proxy_pass http://pme-api:3000;
    include /etc/nginx/conf.d/proxy-common.conf;
  }

  # config.js est remplace a l'execution par le ConfigMap : jamais servi depuis le cache
  location = /config.js {
    expires -1;
  }

  # Fichiers au nom versionne par Vite (index-<hash>.js, index-<hash>.css) : cache long
  location /assets/ {
    expires 1y;
  }

  location = /healthz {
    access_log off;
    return 200 'ok';
  }

  # Application monopage : toute route inconnue rend index.html, qui doit toujours etre
  # revalide pour qu'un nouveau deploiement soit pris en compte sans vider le cache.
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}