# Documentation technique du POC, generee par MkDocs (theme Material).
# Sources : docs/ ; site genere : site/ (non versionne). Voir README, "Documentation".
site_name: La Petite Maison de l'Épouvante — Documentation technique
site_description: Documentation technique du POC (React, NestJS, NATS, Keycloak, Minikube)
repo_url: https://gitlab.com/kitaah/pme
repo_name: kitaah/pme
edit_uri: -/edit/main/docs/

theme:
  name: material
  language: fr
  # Polices du systeme : le site n'appelle pas Google Fonts (aucune requete vers un tiers).
  font: false
  # Un seul theme, clair, comme dans le projet api (pas de bascule automatique selon le systeme)
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight

# Un onglet par grand thème. "Outils" regroupe une fiche par outil du projet (voir outils/modele-fiche.md).
nav:
  - Accueil: index.md
  - Outils:
      - Adminer: outils/adminer.md
      - cert-manager: outils/cert-manager.md
      - Grafana: outils/grafana.md
      - Ingress-nginx: outils/ingress-nginx.md
      - Keycloak: outils/keycloak.md
      - metrics-server: outils/metrics-server.md
      - Minikube: outils/minikube.md
      - MkDocs: outils/mkdocs.md
      - NATS: outils/nats.md
      - NestJS: outils/nestjs.md
      - PostgreSQL: outils/postgresql.md
      - Prometheus: outils/prometheus.md
      - React: outils/react.md
  - Contribuer:
      - Modèle de fiche outil: outils/modele-fiche.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Blocs ```mermaid rendus en diagrammes (schemas C4, flux)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

          # Personnalisation visuelle : gris doux (clair) et anthracite (sombre), contrastes conformes WCAG AA
extra_css:
  - stylesheets/extra.css

# --strict fait echouer la construction sur tout avertissement (lien casse, page absente du menu...).
# Un fichier du depot hors de docs/ (.gitlab-ci.yml, sonar-project.properties...) se cite par son URL GitLab
# complete : un lien relatif "../" n'existe pas dans le site genere.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
