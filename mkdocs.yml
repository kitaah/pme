# Documentation technique du POC, generee par MkDocs (theme Material).
# Sources : docs/ ; site genere : site/ (non versionne). Voir README, "Documentation".
site_name: La Petite Maison de l'Épouvante — Documentation technique
site_description: Documentation technique du POC (React, NestJS, NATS, Keycloak, Minikube)
repo_url: https://gitlab.com/kitaah/pme
repo_name: kitaah/pme
edit_uri: -/edit/main/docs/

theme:
  name: material
  language: fr
  # Polices du systeme : le site n'appelle pas Google Fonts (aucune requete vers un tiers).
  font: false
  # Un seul theme, clair, comme dans le projet api (pas de bascule automatique selon le systeme)
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.highlight

# Un onglet par grand thème. "Outils" regroupe une fiche par outil du projet (voir outils/modele-fiche.md).
# "Pipeline CI/CD" explique les contrôles automatiques : exigences, fonctionnement et une page par famille de tests.
# "Securite" recense les mesures de securite du projet, une page par couche (identite, chiffrement, secrets, conteneurs, application).
nav:
  - Accueil: index.md
  - Outils:
      - Adminer: outils/adminer.md
      - Alloy: outils/alloy.md
      - cert-manager: outils/cert-manager.md
      - container-structure-test: outils/container-structure-test.md
      - GitLab CI: outils/gitlab-ci.md
      - Grafana: outils/grafana.md
      - Istio: outils/istio.md
      - Jest: outils/jest.md
      - k6: outils/k6.md
      - Keycloak: outils/keycloak.md
      - Loki: outils/loki.md
      - metrics-server: outils/metrics-server.md
      - Minikube: outils/minikube.md
      - MkDocs: outils/mkdocs.md
      - NATS: outils/nats.md
      - NestJS: outils/nestjs.md
      - opossum: outils/opossum.md
      - PostgreSQL: outils/postgresql.md
      - Prometheus: outils/prometheus.md
      - React: outils/react.md
      - Sealed Secrets: outils/sealed-secrets.md
      - shadcn/ui: outils/shadcn-ui.md
      - SonarCloud: outils/sonarcloud.md
      - Supertest: outils/supertest.md
      - Testcontainers: outils/testcontainers.md
      - Testing Library: outils/testing-library.md
      - Traefik: outils/traefik.md
      - Trivy: outils/trivy.md
      - Vitest: outils/vitest.md
  - Pipeline CI/CD:
      - Vue d'ensemble: pipeline/index.md
      - Exigences qualité: pipeline/exigences-qualite.md
      - Fonctionnement: pipeline/fonctionnement.md
      - Contrôles:
          - Tests unitaires: pipeline/tests-unitaires.md
          - Tests d'intégration: pipeline/tests-integration.md
          - Lint du code: pipeline/lint-code.md
          - Lint YAML: pipeline/lint-yaml.md
          - Contrôle des Dockerfile: pipeline/controle-dockerfile.md
          - Analyse des dépendances: pipeline/analyse-dependances.md
          - Tests des images Docker: pipeline/tests-images.md
          - Publication des images: pipeline/publication-images.md
          - Tests de performance: pipeline/tests-performance.md
          - Analyse SonarCloud: pipeline/analyse-sonarcloud.md
  - Sécurité:
      - Vue d'ensemble: securite/index.md
      - Authentification: securite/authentification.md
      - Chiffrement: securite/chiffrement.md
      - Secrets: securite/secrets.md
      - Durcissement: securite/durcissement.md
      - Défenses applicatives: securite/application.md
  - Contribuer:
      - Modèle de fiche outil: outils/modele-fiche.md

# Schemas d'architecture : blocs ```d2 transformes en SVG a la construction (binaire d2, aucun JavaScript au chargement)
plugins:
  - search
  - d2

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Blocs ```mermaid rendus en diagrammes (schemas C4, flux)
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

          # Personnalisation visuelle : gris doux (clair) et anthracite (sombre), contrastes conformes WCAG AA
extra_css:
  - stylesheets/extra.css

# --strict fait echouer la construction sur tout avertissement (lien casse, page absente du menu...).
# Un fichier du depot hors de docs/ (.gitlab-ci.yml, sonar-project.properties...) se cite par son URL GitLab
# complete : un lien relatif "../" n'existe pas dans le site genere.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
