# Service de moderation : consomme `listing.submitted` (NATS JetStream) et expose la file de moderation en HTTP.
# Base de donnees dediee (`moderation`) : aucune lecture dans la base de l'API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pme-moderation
  labels:
    app: pme-moderation
    app.kubernetes.io/name: pme-moderation
    app.kubernetes.io/component: backend
spec:
  # Pas de `replicas` : le nombre de pods est piloge par l'autoscaler (k8s/19-autoscaling.yaml, minimum 2).
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: pme-moderation
  template:
    metadata:
      labels:
        app: pme-moderation
        app.kubernetes.io/name: pme-moderation
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: pme-moderation
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
        # Autorite locale, copiee depuis le namespace cert-manager par `make ca-configmap` : sert a verifier
        # le certificat de PostgreSQL. En entreprise, trust-manager produit et maintient cette meme ConfigMap.
        - name: ca
          configMap:
            name: pme-ca
      # Desactive l'injection automatique par Kubernetes des variables d'environnement
      # "liens Docker" d'un Service (ex. NATS_PORT=tcp://<ip>:4222) : son nom entre en
      # collision avec la variable du meme nom que l'application attend (un entier simple).
      enableServiceLinks: false
      containers:
        - name: moderation
          image: pme-moderation:dev
          imagePullPolicy: IfNotPresent # image construite dans Minikube (make image-moderation)
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres
            # Au plus 5 connexions a PostgreSQL par pod : ce service ne fait que consommer des messages.
            - name: DB_POOL_SIZE
              value: "5"
            # Tas de Node plafonne a 75 % de la limite de memoire du conteneur (256 Mi).
            - name: NODE_OPTIONS
              value: "--max-old-space-size=192"
            - name: DB_NAME
              value: moderation
            - name: DB_USER
              value: pme_moderation
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-moderation-password }
            # Chemin de l'autorite locale : sa presence active le TLS vers PostgreSQL, avec verification du nom du
            # serveur (equivalent de sslmode=verify-full). Absente en local et dans les tests : connexion en clair.
            - name: DB_SSL_CA
              value: /etc/ssl/pme/ca.crt
            - name: NATS_HOST
              value: nats
            - name: NATS_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-username }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-password }
            # Meme autorite que pour PostgreSQL : sa presence active le TLS vers NATS, avec verification
            # du nom du serveur. Absente en local et dans les tests : connexion en clair.
            - name: NATS_TLS_CA
              value: /etc/ssl/pme/ca.crt
            # Broker de messages : `nats` ou `rabbitmq`. Se change avec `make broker-nats` / `make broker-rabbitmq`
            # (kubectl set env, sans reconstruire d'image). Les deux brokers tournent en permanence dans le cluster.
            - name: BROKER
              value: nats
            - name: RABBITMQ_HOST
              value: rabbitmq
            # Meme autorite que pour NATS : sa presence active le TLS vers RabbitMQ (port 5671, verification du nom).
            - name: RABBITMQ_TLS_CA
              value: /etc/ssl/pme/ca.crt
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: rabbitmq-username }
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: rabbitmq-password }
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.localhost/realms/pme
            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
            - name: KEYCLOAK_ALLOWED_CLIENTS
              value: pme-web
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca
              mountPath: /etc/ssl/pme
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Le service declare les flux avant d'ecouter : il peut attendre NATS
          # jusqu'a 60 s au premier demarrage. La startupProbe laisse ce temps (5 s x 36 = 180 s)
          # et suspend la livenessProbe jusqu'a son succes ; sans elle, kubelet tue le pod a ~60 s.
          startupProbe:
            httpGet: { path: /api/health/liveness, port: 3001 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/health/readiness, port: 3001 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/liveness, port: 3001 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pme-moderation
  labels:
    app.kubernetes.io/name: pme-moderation
    app.kubernetes.io/component: backend
spec:
  selector:
    app: pme-moderation
  ports:
    - port: 3001
      targetPort: 3001
---
# Service sans adresse (headless) : son nom DNS renvoie l'adresse de chaque pod. Prometheus s'en sert pour interroger
# chaque pod separement (k8s/config/prometheus.yml) ; via le Service normal, chaque lecture tomberait sur un pod different.
apiVersion: v1
kind: Service
metadata:
  name: pme-moderation-headless
  labels:
    app.kubernetes.io/name: pme-moderation
    app.kubernetes.io/component: backend
spec:
  clusterIP: None
  selector:
    app: pme-moderation
  ports:
    - port: 3001
      targetPort: 3001
