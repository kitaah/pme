# API REST NestJS : depose et liste les annonces, publie `listing.submitted` sur NATS JetStream.
# Image construite dans Minikube (make image-api), executee sans privilege root (utilisateur `node`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pme-api
  labels:
    app: pme-api
    app.kubernetes.io/name: pme-api
    app.kubernetes.io/component: backend
spec:
  # Pas de `replicas` : le nombre de pods est piloge par l'autoscaler (k8s/11-autoscaling.yaml, minimum 2).
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: pme-api
  template:
    metadata:
      labels:
        app: pme-api
        app.kubernetes.io/name: pme-api
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: pme-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
        # Autorite locale, copiee depuis le namespace cert-manager par `make ca-configmap` : sert a verifier
        # le certificat de PostgreSQL. En entreprise, trust-manager produit et maintient cette meme ConfigMap.
        - name: ca
          configMap:
            name: pme-ca
      # Desactive l'injection automatique par Kubernetes des variables d'environnement
      # "liens Docker" d'un Service (ex. NATS_PORT=tcp://<ip>:4222) : son nom entre en
      # collision avec la variable du meme nom que l'application attend (un entier simple).
      enableServiceLinks: false
      containers:
        - name: api
          image: pme-api:dev
          imagePullPolicy: IfNotPresent # image construite dans Minikube (make image-api)
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_HOST
              value: postgres
            # Au plus 10 connexions a PostgreSQL par pod (4 pods maximum : voir le budget dans 01-postgres.yaml).
            - name: DB_POOL_SIZE
              value: "10"
            # Tas de Node plafonne a 75 % de la limite de memoire du conteneur (256 Mi) : le ramasse-miettes
            # se declenche avant que Kubernetes ne tue le pod (OOMKilled).
            - name: NODE_OPTIONS
              value: "--max-old-space-size=192"
            - name: DB_NAME
              value: pme
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
            # Chemin de l'autorite locale : sa presence active le TLS vers PostgreSQL, avec verification du nom du
            # serveur (equivalent de sslmode=verify-full). Absente en local et dans les tests : connexion en clair.
            - name: DB_SSL_CA
              value: /etc/ssl/pme/ca.crt
            - name: NATS_HOST
              value: nats
            - name: NATS_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-username }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-password }
            # Meme autorite que pour PostgreSQL : sa presence active le TLS vers NATS, avec verification
            # du nom du serveur. Absente en local et dans les tests : connexion en clair.
            - name: NATS_TLS_CA
              value: /etc/ssl/pme/ca.crt
            # `iss` = URL publique vue par le navigateur ; les cles sont lues via le service interne
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.localhost/realms/pme
            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
            - name: KEYCLOAK_ALLOWED_CLIENTS
              value: pme-web
            # Limite de debit : requetes par minute et par IP, comptees en memoire dans chaque pod. Avec plusieurs pods,
            # la limite effective est multipliee par leur nombre (un compteur partage, par exemple Redis, la rendrait exacte).
            # Le job de performance de la pipeline la leve pour la duree du test (scripts/perf-ci.sh).
            - name: THROTTLE_LIMIT
              value: "200"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca
              mountPath: /etc/ssl/pme
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # L'API retente la connexion a PostgreSQL jusqu'a 30 s avant d'ecouter : meme
          # protection que pour le service de moderation, la liveness n'entre en jeu qu'apres.
          startupProbe:
            httpGet: { path: /api/health/liveness, port: 3000 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/health/readiness, port: 3000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/liveness, port: 3000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pme-api
  labels:
    app.kubernetes.io/name: pme-api
    app.kubernetes.io/component: backend
spec:
  selector:
    app: pme-api
  ports:
    - port: 3000
      targetPort: 3000
---
# Service sans adresse (headless) : son nom DNS renvoie l'adresse de chaque pod. Prometheus s'en sert pour interroger
# chaque pod separement (k8s/config/prometheus.yml) ; via le Service normal, chaque lecture tomberait sur un pod different.
apiVersion: v1
kind: Service
metadata:
  name: pme-api-headless
  labels:
    app.kubernetes.io/name: pme-api
    app.kubernetes.io/component: backend
spec:
  clusterIP: None
  selector:
    app: pme-api
  ports:
    - port: 3000
      targetPort: 3000
