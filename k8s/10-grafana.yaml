# Grafana : tableaux de bord construits sur les metriques de Prometheus.
# La source de donnees et le tableau de bord sont fournis au demarrage (provisioning) par des ConfigMaps :
# rien n'est a configurer a la main, et un redemarrage retrouve le meme etat.
# L'etat interne de Grafana (comptes, preferences) est dans PostgreSQL, base `grafana` : meme principe que Keycloak,
# il survit a la recreation du pod. La base est creee par postgres-init.sh (ou par make create-grafana-db).
# Joint par l'ingress (k8s/08-ingress.yaml) sur https://grafana.localhost (make grafana).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
    spec:
      # Pas de variables d'environnement "liens Docker" injectees par Kubernetes (ex. GRAFANA_PORT=tcp://...).
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        seccompProfile: { type: RuntimeDefault }
      # Attend PostgreSQL avant de lancer l'application : evite les redemarrages (CrashLoopBackOff)
      # du premier demarrage, quand le service demarre plus vite que la base.
      # `-U postgres` : l'utilisateur du pod (UID impose) n'existe pas dans l'image, et sans nom d'utilisateur
      # pg_isready renonce a tenter la connexion ("no attempt").
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U postgres; do echo 'En attente de PostgreSQL'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: grafana
          image: grafana/grafana:12.4.13
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: grafana-admin-username }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: grafana-admin-password }
            # Adresse publique : Grafana s'en sert pour ses redirections (connexion, deconnexion).
            - name: GF_SERVER_DOMAIN
              value: grafana.localhost
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.localhost/
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: postgres:5432
            - name: GF_DATABASE_NAME
              value: grafana
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
            # Pas de TLS interne dans ce POC : la connexion a PostgreSQL n'est pas chiffree.
            - name: GF_DATABASE_SSL_MODE
              value: disable
            # Aucune requete sortante vers grafana.com (statistiques d'usage, recherche de mises a jour).
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000