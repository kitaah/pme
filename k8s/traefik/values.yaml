# Reglages du chart Helm de Traefik (installe par `make ingress`, version epinglee dans le Makefile).
# Seules les valeurs qui different des valeurs par defaut du chart sont listees.

# Pas de verification de nouvelle version au demarrage : Traefik ne contacte aucun service exterieur.
# (L'envoi de statistiques d'usage anonymes est deja desactive par defaut.)
global:
  checkNewVersion: false

# Ports du noeud Minikube. Traefik ecoute sur les ports 80 et 443 du noeud (hostPort), comme l'addon ingress-nginx
# qu'il remplace : un cluster cree par `make minikube-up` (--ports 80 et 443) est donc joignable sans `make tunnel`.
# Le HTTP est redirige vers le HTTPS par Traefik lui-meme, pour tous les noms d'hote, sans annotation par Ingress.
ports:
  web:
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    hostPort: 443

# Plugin de validation des jetons JWT (k8s/13-middlewares.yaml). Traefik open source n'a pas de middleware JWT integre
# (il est reserve a Traefik Hub) : ce plugin communautaire, interprete par Traefik (Yaegi), le remplace. Il est declare ici,
# dans la configuration statique, puis telecharge depuis GitHub au demarrage du controleur : Traefik doit donc pouvoir
# joindre Internet, et la version est epinglee. Fonction "experimentale" de Traefik.
experimental:
  plugins:
    jwt:
      moduleName: github.com/agilezebra/jwt-middleware
      version: v1.6.0

# Mise a jour : l'ancien pod est arrete AVANT de demarrer le nouveau. Traefik occupe les ports 80 et 443 du noeud (hostPort) ;
# avec la strategie par defaut (le nouveau pod demarre avant l'arret de l'ancien), le nouveau reste "Pending" ("didn't have
# free ports") sur un noeud unique, et `make ingress` expire. Contrepartie : l'ingress est coupe quelques secondes pendant
# une mise a jour, acceptable pour ce POC.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

# Service interne : l'entree se fait par les ports du noeud, pas par un equilibreur de charge externe.
service:
  type: ClusterIP

# Journal d'acces au format JSON, lisible avec `kubectl -n traefik logs deploy/traefik`.
# Les en-tetes ne sont pas journalises (valeur par defaut du chart) : ni jeton, ni cookie dans les journaux.
# Alloy ne lit que le namespace pme (k8s/17-alloy.yaml) : ce journal n'arrive donc pas dans Loki.
accessLog:
  enabled: true
  format: json

# L'interface web de Traefik (tableau de bord) n'est pas exposee : elle ne sert pas au projet.
ingressRoute:
  dashboard:
    enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
