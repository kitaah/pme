# Traitements appliques par Traefik aux requetes et aux reponses (ressources `Middleware`).
# Ils remplacent les reglages que le controleur ingress-nginx portait dans sa ConfigMap. Ils sont rattaches a
# l'Ingress `pme` par l'annotation traefik.ingress.kubernetes.io/router.middlewares (k8s/08-ingress.yaml).
#
# HSTS : le navigateur n'utilisera plus que HTTPS pour ces noms pendant `stsSeconds` secondes. Duree volontairement
# courte (7 jours) : un HSTS actif interdit de passer outre l'alerte du certificat, ce qui bloque le site apres un
# changement d'autorite locale tant que le navigateur le retient. En production : 31536000 (1 an), une fois le HTTPS
# valide partout. Pas de sous-domaines (les six noms sont distincts) ni de prechargement (liste publique des
# navigateurs, irreversible).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
spec:
  headers:
    stsSeconds: 604800
    stsIncludeSubdomains: false
    stsPreload: false
---
# Compression des reponses superieures a 1 Ko (gzip, ou un format plus recent si le navigateur le demande).
# Traefik ne recompresse pas les contenus deja compresses (images, archives).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    minResponseBodyBytes: 1024
---
# Les deux traitements ensemble : l'Ingress ne reference que cette chaine.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: web-defaults
spec:
  chain:
    middlewares:
      - name: hsts
      - name: compress
---
# Validation des jetons a l'entree du cluster : le plugin `jwt` (declare dans k8s/traefik/values.yaml) verifie la signature,
# l'expiration, l'emetteur et le client du jeton AVANT que la requete atteigne l'API ou la moderation. Sans jeton valide, la
# reponse est une erreur 401 emise par Traefik. Chaque service revalide ensuite le jeton lui-meme et applique les roles
# (garde JWT et garde de roles de NestJS) : le controle de l'ingress est une premiere barriere, pas la seule.
#
# - issuer : l'`iss` des jetons est l'URL PUBLIQUE de Keycloak (celle que voit le navigateur), comme pour l'API.
# - jwks : les cles sont lues par le service INTERNE, en HTTP, dans le namespace pme (Traefik est dans un autre namespace :
#   le nom complet est necessaire). Ce chemin est autorise par les politiques d'Istio et de Calico (le compte `traefik`
#   joint Keycloak sur le port 8080). Cette forme dispense de la decouverte OpenID Connect, qui passerait par l'adresse
#   publique, injoignable depuis le pod.
# - require.azp : seul le client `pme-web` (l'interface) est accepte, comme KEYCLOAK_ALLOWED_CLIENTS dans les services.
# - skipPrefetch : les cles ne sont pas chargees au demarrage de Traefik (Keycloak peut ne pas etre encore pret) ; elles le
#   sont a la premiere requete, et rechargees si un jeton porte une cle inconnue.
# Les roles (membre, moderateur) ne sont PAS verifies ici : ils restent decides par les services.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jwt
spec:
  plugin:
    jwt:
      issuers:
        - issuer: https://keycloak.localhost/realms/pme
          jwks: http://keycloak.pme.svc.cluster.local:8080/realms/pme/protocol/openid-connect/certs
      require:
        azp: pme-web
      skipPrefetch: true
---
# Limitation de debit a l'entree : 200 requetes par minute et par adresse source, avec une rafale tolerable de 50. Au-dela,
# Traefik repond 429 sans solliciter l'API. Traefik n'a qu'un exemplaire : le compteur est unique, donc exact (celui de
# l'API, lui, est compte par pod). Ce plafond s'applique AVANT la validation du jeton, pour que des requetes sans jeton
# soient limitees elles aussi. L'API garde son propre limiteur : deuxieme barriere, elle ne fait pas confiance a l'ingress.
# Remarque : sur Minikube, l'adresse source vue par Traefik peut etre celle de la passerelle Docker, commune a tous les
# clients locaux ; en production, elle serait celle du client (reglage `sourceCriterion.ipStrategy` selon les relais).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: 200
    period: 1m
    burst: 50
---
# Taille maximale du corps d'une requete : 6 Mo. Le depot d'une annonce porte une photo de 5 Mo au
# plus (api/src/listings/listings.controller.ts) ; le million d'octets restant couvre les champs
# texte et l'encodage multipart. Au-dela, Traefik repond 413 sans solliciter l'API : un envoi
# manifestement trop gros ne consomme ni memoire ni temps de calcul du service.
# `memRequestBodyBytes` : au-dela de 1 Mo, Traefik ecrit le corps dans un fichier temporaire
# plutot que de le garder en memoire.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  buffering:
    maxRequestBodyBytes: 6291456
    memRequestBodyBytes: 1048576
---
# Chaine de l'API et de la moderation : les traitements de reponse, la taille du corps, la
# limitation de debit, puis la validation du jeton.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-defaults
spec:
  chain:
    middlewares:
      - name: hsts
      - name: compress
      - name: body-limit
      - name: rate-limit
      - name: jwt
