# Ingress HTTPS : un seul point d'entree pour les interfaces web, un nom d'hote .localhost par service.
# Le TLS s'arrete ici (terminaison a l'ingress) : le certificat `pme-tls` vient de cert-manager (k8s/08-certificate.yaml).
# Le HTTP est redirige vers le HTTPS par Traefik (k8s/traefik/values.yaml). Derriere l'ingress, les services restent en HTTP dans le cluster.
# Le suffixe .localhost est voulu : les navigateurs traitent ces noms comme un contexte securise.
# keycloak-js (PKCE) en a besoin ; avec un suffixe .local, la connexion echoue.
#   pme.localhost        -> trois chemins, le plus long l'emporte :
#                             /api/v1/moderation -> pme-moderation
#                             /api/v1            -> pme-api
#                             /                  -> pme-frontend (fichiers statiques)
#                           Seul le prefixe /api/v1 est expose : /api/metrics et /api/health restent internes
#                           (Prometheus et les sondes Kubernetes les lisent directement sur les services).
#   keycloak.localhost   -> keycloak
#   adminer.localhost    -> adminer
#   grafana.localhost    -> grafana
#   prometheus.localhost -> prometheus
#   alloy.localhost      -> alloy (interface de suivi de la collecte des logs)
# Loki, NATS, PostgreSQL et MkDocs n'ont pas d'ingress (Loki n'est interroge que par Grafana) : NATS et PostgreSQL restent joints par "make port-forward".
#
# Controleur : Traefik, installe par Helm (make ingress). Il remplace ingress-nginx, archive en mars 2026.
# Les anciennes annotations nginx.ingress.kubernetes.io/* n'existent plus : la redirection vers HTTPS est faite par
# Traefik pour tous les noms, et la taille des en-tetes de Keycloak (erreur 502 avec nginx, tampon de 16 Ko) n'est
# plus un sujet, Traefik n'ayant pas ce tampon. HSTS et compression : k8s/08-middlewares.yaml.
#
# Le navigateur doit faire confiance a l'autorite locale (make ca-cert), sinon il affiche un avertissement.
# Les noms d'hote sont aussi ecrits dans le Makefile (APP_HOST...), k8s/03-keycloak.yaml, 04-api.yaml,
# 05-moderation.yaml, 10-grafana.yaml, config/realm-pme.json et config/frontend-config.js : a changer ensemble.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pme
  annotations:
    # <namespace>-<nom>@kubernetescrd : la chaine HSTS + compression de k8s/08-middlewares.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: pme-web-defaults@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: pme-tls
      hosts:
        - pme.localhost
        - keycloak.localhost
        - adminer.localhost
        - grafana.localhost
        - prometheus.localhost
        - alloy.localhost
  rules:
    - host: pme.localhost
      http:
        paths:
          - path: /api/v1/moderation
            pathType: Prefix
            backend:
              service: { name: pme-moderation, port: { number: 3001 } }
          - path: /api/v1
            pathType: Prefix
            backend:
              service: { name: pme-api, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: pme-frontend, port: { number: 8080 } }
    - host: keycloak.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: keycloak, port: { number: 8080 } }
    - host: adminer.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: adminer, port: { number: 8080 } }
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: grafana, port: { number: 3000 } }
    - host: prometheus.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: prometheus, port: { number: 9090 } }
    - host: alloy.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: alloy, port: { number: 12345 } }
