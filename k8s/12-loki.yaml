# Loki : conserve les logs des services et permet de les interroger (langage LogQL), depuis Grafana.
# Les logs sont ecrits dans le conteneur (volume temporaire, limite a 1 Gi) : ils disparaissent au redemarrage du pod, comme les mesures de Prometheus.
# Aucune authentification et pas d'ingress : Loki n'a pas d'interface web, seul Grafana l'interroge (http://loki:3100).
# Ce sont les pods Alloy (k8s/13-alloy.yaml) qui lui envoient les logs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: monitoring
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          # Plafond de taille : un pic de logs (test de charge) ne peut pas remplir le disque du noeud Minikube.
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100