# PostgreSQL 18 : une instance, trois bases (pme, moderation, keycloak) creees par postgres-init.sh.
# Simplification du POC par rapport au projet Spring : pas de TLS interne (sslmode=require retire).
# Durcissement partiel : l'entrypoint de l'image demarre en root pour initialiser le volume, puis passe a l'utilisateur
# `postgres`. Les capacites ne sont donc pas toutes retirees (voir le namespace : `restricted` est seulement audite).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:18-alpine
          args: ["postgres", "-c", "shared_buffers=64MB"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pme
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql (et non /data) : les donnees sont dans
            # un sous-dossier par version majeure (18/docker), ce qui permet de preparer un futur pg_upgrade.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Le premier demarrage initialise le volume et cree les bases (postgres-init.sh) : la startupProbe laisse
          # jusqu'a 150 s (5 s x 30) avant que la liveness ne s'applique.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432