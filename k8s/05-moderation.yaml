# Service de moderation : consomme `listing.submitted` (NATS JetStream) et expose la file de moderation en HTTP.
# Base de donnees dediee (`moderation`) : aucune lecture dans la base de l'API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pme-moderation
  labels:
    app: pme-moderation
    app.kubernetes.io/name: pme-moderation
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: pme-moderation
  template:
    metadata:
      labels:
        app: pme-moderation
        app.kubernetes.io/name: pme-moderation
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: {}
      # Desactive l'injection automatique par Kubernetes des variables d'environnement
      # "liens Docker" d'un Service (ex. NATS_PORT=tcp://<ip>:4222) : son nom entre en
      # collision avec la variable du meme nom que l'application attend (un entier simple).
      enableServiceLinks: false
      containers:
        - name: moderation
          image: pme-moderation:dev
          imagePullPolicy: IfNotPresent # image construite dans Minikube (make image-moderation)
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: moderation
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
            - name: NATS_HOST
              value: nats
            - name: NATS_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-username }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-password }
            - name: KEYCLOAK_ISSUER
              value: https://keycloak.localhost/realms/pme
            - name: KEYCLOAK_JWKS_URI
              value: http://keycloak:8080/realms/pme/protocol/openid-connect/certs
            - name: KEYCLOAK_ALLOWED_CLIENTS
              value: pme-web,pme-cli
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          # Le service declare les flux avant d'ecouter : il peut attendre NATS
          # jusqu'a 60 s au premier demarrage. La startupProbe laisse ce temps (5 s x 36 = 180 s)
          # et suspend la livenessProbe jusqu'a son succes ; sans elle, kubelet tue le pod a ~60 s.
          startupProbe:
            httpGet: { path: /api/health/liveness, port: 3001 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /api/health/readiness, port: 3001 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/liveness, port: 3001 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pme-moderation
  labels:
    app.kubernetes.io/name: pme-moderation
    app.kubernetes.io/component: backend
spec:
  selector:
    app: pme-moderation
  ports:
    - port: 3001
      targetPort: 3001