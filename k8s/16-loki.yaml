# Loki : conserve les logs des services et permet de les interroger (langage LogQL), depuis Grafana.
# Les logs sont ecrits sur un volume persistant (PersistentVolumeClaim ci-dessous, 1Gi) : ils survivent au redemarrage du pod,
# et disparaissent avec le namespace (`make undeploy`). La taille du volume sert de plafond : un pic de logs (test de charge)
# ne peut pas remplir le disque du noeud Minikube. En production, Loki ecrirait dans un stockage objet (S3, GCS).
# Aucune authentification et pas d'ingress : Loki n'a pas d'interface web, seul Grafana l'interroge (http://loki:3100).
# Ce sont les pods Alloy (k8s/17-alloy.yaml) qui lui envoient les logs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Volume ReadWriteOnce : l'ancien pod doit etre arrete avant le nouveau.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: monitoring
    spec:
      enableServiceLinks: false
      serviceAccountName: loki
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
