# NATS 2.14 avec JetStream (option -js) : le stockage durable des messages.
# Sans JetStream, NATS ne garde rien : un message publie alors que le service de moderation est
# arrete serait perdu. JetStream apporte le flux durable, l'acquittement manuel et la remise en file.
#
# Deux ports : 4222 pour les clients, 8222 pour la supervision en HTTPS (/healthz, /jsz).
# Le Service publie 4222 (clients) et 7777 (metriques pour Prometheus, voir ci-dessous) : le port 8222 n'est joignable que
# depuis le pod lui-meme (`make queues`, via kubectl exec, et le conteneur `exporter`) et par les sondes de Kubernetes,
# qui s'adressent au pod. Les autres pods du namespace ne peuvent pas le lire.
#
# Metriques : NATS ne parle pas le format de Prometheus. Le conteneur `exporter`, dans le meme pod, relit /varz et /jsz
# sur https://localhost:8222 et les expose sur le port 7777. Il fait confiance a l'autorite locale (SSL_CERT_FILE) : le
# certificat de NATS couvre `localhost`.
# Pour le consulter depuis l'ordinateur : `make port-forward`, qui vise le Deployment et non le Service.
# NATS n'a pas d'interface web : l'etat des flux se lit sur /jsz (voir `make queues` et `make nats`).
#
# Stockage persistant (PersistentVolumeClaim ci-dessous, 1Gi, comme PostgreSQL dans k8s/03-postgres.yaml) :
# les messages survivent desormais a l'arret du SERVICE DE MODERATION (ils restent dans le flux) et a la
# perte du pod NATS (redemarrage, mise a jour de l'image). La limite de stockage de JetStream (768 Mo, sous les 1Gi
# du volume) est dans k8s/config/nats.conf : cette option n'existe qu'en fichier. NATS refuse alors les nouveaux
# messages avant de remplir le disque, plutot que de planter dessus.
#
# Connexions des clients chiffrees en TLS 1.3 exclusivement (k8s/config/nats.conf), avec un certificat
# signe par l'autorite locale (k8s/00-internal-tls.yaml). Le port de supervision 8222 est lui aussi en HTTPS,
# avec le meme certificat (`https_port` dans k8s/config/nats.conf). Les sondes de Kubernetes le lisent avec
# `scheme: HTTPS` (le kubelet n'y verifie pas le certificat) et `make queues` avec wget, depuis le pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
      annotations:
        # Avec deux conteneurs, `kubectl logs` et `kubectl exec` (make logs-nats, make queues) visent celui-ci par defaut.
        kubectl.kubernetes.io/default-container: nats
    spec:
      serviceAccountName: nats
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2.14-alpine
          # Kubernetes remplace $(VAR) par la variable d'environnement du conteneur declaree ci-dessous.
          args:
            - "-js"
            - "--store_dir=/data/jetstream"
            - "--user=$(NATS_USER)"
            - "--pass=$(NATS_PASSWORD)"
            # Le chiffrement du port des clients est decrit dans k8s/config/nats.conf (certificat, cle et
            # version minimale de TLS), et non en options : `min_version` n'existe qu'en fichier.
            # Le chiffrement n'exige pas de certificat des clients (ce serait --tlsverify, et il faudrait
            # alors emettre un certificat par service). NATS ne relit pas son certificat a chaud : apres un
            # renouvellement (90 jours), redemarrer le pod (`kubectl -n pme rollout restart deploy/nats`).
            - "--config=/etc/nats/conf/nats.conf"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-username }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: jetstream
              mountPath: /data/jetstream
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: config
              mountPath: /etc/nats/conf
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8222, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8222, scheme: HTTPS }
            initialDelaySeconds: 15
            periodSeconds: 20
        # Convertit la supervision de NATS au format Prometheus (port 7777). Lecture seule, sans droits, sans acces reseau
        # sortant : il ne parle qu'a NATS, dans le pod.
        - name: exporter
          image: natsio/prometheus-nats-exporter:0.16.0
          args:
            - "-varz"
            - "-jsz=all"
            - "https://localhost:8222"
          ports:
            - name: metrics
              containerPort: 7777
          env:
            # Go lit ce fichier a la place des autorites du systeme : le certificat de NATS est signe par l'autorite locale.
            - name: SSL_CERT_FILE
              value: /etc/nats/ca/ca.crt
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: tls-ca
              mountPath: /etc/nats/ca
              readOnly: true
      volumes:
        - name: jetstream
          persistentVolumeClaim:
            claimName: nats-data
        # 0440 : lisible par le proprietaire (root, qui execute nats-server dans cette image) et son groupe.
        - name: tls
          secret:
            secretName: nats-tls
            defaultMode: 0440
        # Le certificat de l'autorite seul (public), lisible par l'exporter qui ne tourne pas en root.
        - name: tls-ca
          secret:
            secretName: nats-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: config
          configMap:
            name: nats-config
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: metrics
      port: 7777
      targetPort: 7777
