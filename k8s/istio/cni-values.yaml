# Reglages du chart Helm istio-cni (agent par noeud qui redirige le trafic des pods vers ztunnel), installe par `make istio`.
# Seules les valeurs qui different des valeurs par defaut du chart sont listees.
profile: ambient

# Pas de `global.platform: minikube` : cette valeur fait monter a l'agent le dossier /var/run/docker/netns, celui du
# moteur Docker. Minikube utilise containerd, qui range les espaces reseau des pods dans /var/run/netns (valeur par
# defaut du chart). Avec la valeur "minikube", l'agent ne voit aucun espace reseau et tous les pods restent bloques
# en ContainerCreating ("failed to open netns ... no such file or directory").

resources:
  requests:
    cpu: 50m
    memory: 64Mi
