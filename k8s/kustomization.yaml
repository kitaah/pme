# `kubectl apply -k k8s/` (ou `make deploy`). Le secret `pme-secrets` est fourni sous forme chiffree (SealedSecret,
# 14-pme-secrets-sealed.yaml, genere par `make seal`) : le controleur Sealed Secrets le dechiffre dans le cluster.
# Les ConfigMaps sont generes avec un suffixe de hash : modifier le realm ou la config du front
# declenche automatiquement un redemarrage des pods concernes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pme
resources:
  - namespace.yaml
  - 00-internal-tls.yaml
  - 01-postgres.yaml
  - 02-nats.yaml
  - 03-keycloak.yaml
  - 03-keycloak-admin-job.yaml
  - 03-garage.yaml
  - 04-api.yaml
  - 05-moderation.yaml
  - 06-frontend.yaml
  - 07-adminer.yaml
  - 08-certificate.yaml
  - 08-middlewares.yaml
  - 08-ingress.yaml
  - 09-prometheus.yaml
  - 10-grafana.yaml
  - 11-autoscaling.yaml
  - 12-loki.yaml
  - 13-alloy.yaml
  - 14-pme-secrets-sealed.yaml
  - 15-service-accounts.yaml
  - 16-mesh-mtls.yaml
  - 17-authorization-policies.yaml
  - 18-network-policies.yaml
# Label commun a toutes les ressources et aux modeles de pods. Les selecteurs ne changent pas (immuables).
labels:
  - pairs:
      app.kubernetes.io/part-of: pme
    includeSelectors: false
    includeTemplates: true
configMapGenerator:
  - name: postgres-init
    files:
      - init-databases.sh=config/postgres-init.sh
  - name: postgres-hba
    files:
      - pg_hba.conf=config/postgres-hba.conf
  - name: nats-config
    files:
      - nats.conf=config/nats.conf
  - name: keycloak-realm
    files:
      - realm-pme.json=config/realm-pme.json
  # Theme de connexion « pme » : les cles sont montees aux chemins attendus par Keycloak
  # (k8s/03-keycloak.yaml). Les fichiers de police sont binaires : Kustomize les range
  # automatiquement dans `binaryData`.
  - name: keycloak-theme
    files:
      - theme.properties=config/keycloak-theme-properties
      - pme.css=config/keycloak-theme.css
      - roboto-400.woff2=config/roboto-latin-400-normal.woff2
      - roboto-700.woff2=config/roboto-latin-700-normal.woff2
  - name: garage-config
    files:
      - garage.toml=config/garage.toml
  - name: frontend-config
    files:
      - config.js=config/frontend-config.js
  - name: prometheus-config
    files:
      - prometheus.yml=config/prometheus.yml
  - name: loki-config
    files:
      - loki.yml=config/loki.yml
  - name: alloy-config
    files:
      - config.alloy=config/alloy.alloy
  - name: grafana-datasources
    files:
      - prometheus.yml=config/grafana-datasource.yml
      - loki.yml=config/grafana-datasource-loki.yml
  - name: grafana-dashboards-provider
    files:
      - dashboards.yml=config/grafana-dashboards.yml
  - name: grafana-dashboards
    files:
      - pme.json=config/grafana-dashboard-pme.json
      - logs.json=config/grafana-dashboard-logs.json
# Point d'entree pour la future chaine CI/CD : `kustomize edit set image pme-api=<registre>/pme-api:<sha>`
images:
  - name: pme-api
    newTag: dev
  - name: pme-moderation
    newTag: dev
  - name: pme-frontend
    newTag: dev
