# PostgreSQL 18 : une instance, quatre bases (pme, moderation, keycloak, grafana), chacune avec son compte, creees par postgres-init.sh.
# Connexions chiffrees : certificat signe par l'autorite locale (k8s/00-internal-tls.yaml) et TLS obligatoire
# pour tout ce qui vient du reseau (k8s/config/postgres-hba.conf). Les clients verifient le certificat du
# serveur (`verify-full`) grace a la ConfigMap `pme-ca` (make ca-configmap).
# Durcissement partiel : l'entrypoint de l'image demarre en root pour initialiser le volume, puis passe a l'utilisateur
# `postgres`. Les capacites ne sont donc pas toutes retirees (voir le namespace : `restricted` est seulement audite).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # PostgreSQL refuse de demarrer si sa cle privee est lisible au-dela de son proprietaire et de son groupe.
        # Un Secret monte appartient a root : fsGroup en donne le groupe a `postgres` (GID 70 dans l'image Alpine),
        # qui peut alors lire la cle en 0640. OnRootMismatch evite de reparcourir le volume de donnees a chaque demarrage.
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:18-alpine
          args:
            - postgres
            - -c
            - shared_buffers=64MB
            # Budget de connexions (100 au maximum, dont 3 reservees au superutilisateur) :
            # API 4 pods x 10 + moderation 3 pods x 5 + Keycloak 10 + Grafana 10 = 75, soit 22 de marge
            # pour les deploiements progressifs, Adminer et psql. Si l'autoscaler ou un pool change, refaire le calcul.
            - -c
            - max_connections=100
            # TLS : certificat et cle fournis par cert-manager, qui les renouvele seul dans le Secret `postgres-tls`.
            # PostgreSQL ne relit ses certificats qu'au signal de rechargement : apres un renouvellement (90 jours),
            # redemarrer le pod (`kubectl -n pme rollout restart deploy/postgres`).
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            # Version minimale : le serveur refuse de negocier TLS 1.2 ou plus ancien (defaut : TLSv1.2).
            - -c
            - ssl_min_protocol_version=TLSv1.3
            # Regles d'acces : TLS obligatoire depuis le reseau (voir le fichier).
            - -c
            - hba_file=/etc/postgresql/hba/pg_hba.conf
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pme
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
            # Mots de passe des quatre comptes de service, lus UNE fois par postgres-init.sh pour les creer.
            - name: DB_API_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-api-password }
            - name: DB_MODERATION_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-moderation-password }
            - name: DB_KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-keycloak-password }
            - name: DB_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-grafana-password }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          volumeMounts:
            # Depuis PostgreSQL 18, l'image attend le volume sur /var/lib/postgresql (et non /data) : les donnees sont dans
            # un sous-dossier par version majeure (18/docker), ce qui permet de preparer un futur pg_upgrade.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql/hba
              readOnly: true
          # Le premier demarrage initialise le volume et cree les bases (postgres-init.sh) : la startupProbe laisse
          # jusqu'a 150 s (5 s x 30) avant que la liveness ne s'applique.
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d pme -h 127.0.0.1"]
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0555
        # 0640 : lisible par root (proprietaire) et par le groupe `postgres` (fsGroup ci-dessus), par personne d'autre.
        - name: tls
          secret:
            secretName: postgres-tls
            defaultMode: 0640
        - name: hba
          configMap:
            name: postgres-hba
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
