# RabbitMQ 4.3 : seconde solution de messagerie du POC, comparee a NATS JetStream (k8s/04-nats.yaml).
# Les deux brokers tournent en permanence ; l'API et la moderation parlent a celui que designe la variable BROKER
# (k8s/08-api.yaml et k8s/09-moderation.yaml). `make broker-nats` / `make broker-rabbitmq` changent ce choix sans
# reconstruire d'image.
#
# Trois ports sont publies par le Service : 5671 (AMQP chiffre, clients), 15672 (interface de gestion) et 15692
# (metriques pour Prometheus, en clair dans le maillage Istio comme les autres lectures de Prometheus). Le port AMQP en
# clair (5672) est desactive : k8s/config/rabbitmq.conf active TLS 1.3 avec le certificat `rabbitmq-tls`
# (k8s/00-internal-tls.yaml), en plus du mTLS d'Istio, comme pour NATS.
# L'image `-management` embarque l'interface web de gestion (port 15672, HTTP) : l'ingress Traefik la sert en HTTPS sur
# https://rabbitmq.localhost (`make rabbitmq`, connexion avec RABBITMQ_USER et RABBITMQ_PASSWORD du fichier .env).
# L'etat des files se lit aussi en ligne de commande : `make queues-rabbitmq` (rabbitmqctl, via kubectl exec).
#
# RABBITMQ_NODENAME fige le nom du noeud : par defaut il contient le nom d'hote du pod, qui change a chaque recreation.
# Les donnees du volume (files durables, messages persistants) sont rangees sous ce nom et deviendraient introuvables.
# Le conteneur demarre en root pour initialiser le volume, puis l'image passe sur l'utilisateur `rabbitmq` : les
# capacites CHOWN, SETUID, SETGID, DAC_OVERRIDE et FOWNER (toutes admises par le niveau `baseline`) lui suffisent pour cela.
# Les identifiants de l'administrateur par defaut viennent du Secret `pme-secrets` (cles rabbitmq-username et
# rabbitmq-password) : l'API et la moderation se connectent avec ce compte.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: messaging
    spec:
      serviceAccountName: rabbitmq
      automountServiceAccountToken: false
      # Sans cela, Kubernetes injecte des variables RABBITMQ_* issues du Service `rabbitmq` (ex. RABBITMQ_PORT=tcp://...),
      # qui entrent en collision avec les variables que l'image attend.
      enableServiceLinks: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3-management-alpine
          ports:
            - name: amqps
              containerPort: 5671
            - name: management
              containerPort: 15672
            # Metriques au format Prometheus (plugin rabbitmq_prometheus, actif dans l'image), lues par Prometheus.
            - name: metrics
              containerPort: 15692
          env:
            - name: RABBITMQ_NODENAME
              value: rabbit@localhost
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: rabbitmq-username }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: rabbitmq-password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tls
              mountPath: /etc/rabbitmq/tls
              readOnly: true
            # Un seul fichier, ajoute a ceux de l'image : les autres fichiers de conf.d sont conserves.
            - name: config
              mountPath: /etc/rabbitmq/conf.d/30-tls.conf
              subPath: rabbitmq.conf
              readOnly: true
          # L'amorcage d'Erlang prend plusieurs secondes : la startupProbe laisse 3 minutes au premier demarrage et
          # suspend les autres sondes jusqu'a son succes. Les commandes rabbitmq-diagnostics sont lentes (elles
          # demarrent un noeud Erlang), d'ou les delais larges.
          startupProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        # 0444 : RabbitMQ lit ses fichiers avec l'utilisateur `rabbitmq`, pas root. Seul ce processus tourne dans le
        # conteneur : la cle n'est donc lisible que par lui.
        - name: tls
          secret:
            secretName: rabbitmq-tls
            defaultMode: 0444
        - name: config
          configMap:
            name: rabbitmq-config
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/component: messaging
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqps
      port: 5671
      targetPort: 5671
    # Interface de gestion : jointe par l'ingress Traefik (https://rabbitmq.localhost, k8s/14-ingress.yaml).
    - name: management
      port: 15672
      targetPort: 15672
    - name: metrics
      port: 15692
      targetPort: 15692
