# Keycloak 26 en mode dev, joint par l'ingress (k8s/14-ingress.yaml) sur https://keycloak.localhost (TLS termine a l'ingress, HTTP en interne).
# Le realm `pme` (roles membre / moderateur, clients pme-web et pme-cli, utilisateurs de demonstration)
# est importe au demarrage depuis le ConfigMap `keycloak-realm` (config/realm-pme.json).
# Le theme de connexion `pme` (palette et police du site) vient du ConfigMap `keycloak-theme`
# (config/keycloak-theme-properties, config/keycloak-theme.css) et est declare par `loginTheme`
# dans le realm. Le realm n'etant importe qu'une fois, un realm deja importe doit etre supprime
# (console d'administration) ou la base repartie de zero (`make reset`) pour que la declaration
# du theme et la langue unique soient prises en compte.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      serviceAccountName: keycloak
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      # Attend PostgreSQL avant de lancer l'application : evite les redemarrages (CrashLoopBackOff)
      # du premier demarrage, quand le service demarre plus vite que la base.
      # `-U postgres` : l'utilisateur du pod (UID impose) n'existe pas dans l'image, et sans nom d'utilisateur
      # pg_isready renonce a tenter la connexion ("no attempt").
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U postgres; do echo 'En attente de PostgreSQL'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          args:
            - start-dev
            - --import-realm
            - --db=postgres
            # Pool limite a 10 connexions (100 par defaut) : voir le budget dans 03-postgres.yaml.
            - --db-pool-max-size=10
            # sslmode=verify-full : connexion chiffree ET verification du nom du serveur contre l'autorite locale.
            - "--db-url=jdbc:postgresql://postgres:5432/keycloak?sslmode=verify-full&sslrootcert=/etc/ssl/pme/ca.crt"
            # Keycloak est joint par l'ingress sur https://keycloak.localhost. --hostname fige
            # l'URL publique : l'emetteur (iss) des jetons vaut toujours
            # https://keycloak.localhost/realms/pme, quel que soit le chemin emprunte pour atteindre
            # Keycloak. L'API peut donc lire les cles par l'adresse interne du service sans que
            # l'emetteur change.
            - --hostname=https://keycloak.localhost
            # Keycloak est derriere un proxy (Traefik) qui termine le HTTP : il lit les
            # en-tetes X-Forwarded-* au lieu de les ignorer.
            - --proxy-headers=xforwarded
          ports:
            - containerPort: 8080
          env:
            # Compte d'amorcage : Keycloak 26 le considere comme temporaire (bandeau d'avertissement dans la console).
            # Le Job k8s/07-keycloak-admin-job.yaml cree l'administrateur permanent (keycloak-admin-username) puis
            # supprime ce compte. Le nom est donc fixe et different de l'administrateur permanent.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: bootstrap
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: keycloak-admin-password }
            - name: KC_DB_USERNAME
              value: pme_keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-keycloak-password }
            # Limite le heap JVM (voir projet Spring : jusqu'a 800Mi observes sans limite)
            - name: JAVA_OPTS_APPEND
              value: "-Xmx384m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 1000m, memory: 768Mi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # Theme de connexion « pme » : chaque cle du ConfigMap est ecrite au chemin que Keycloak
            # attend sous le dossier du theme. En mode `start-dev`, les themes ne sont pas mis en
            # cache : une modification du ConfigMap est visible au redemarrage du pod.
            - name: theme
              mountPath: /opt/keycloak/themes/pme/login
              readOnly: true
            - name: ca
              mountPath: /etc/ssl/pme
              readOnly: true
          # /realms/pme repond une fois le realm importe : la sonde valide donc aussi l'import
          startupProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - { key: theme.properties, path: theme.properties }
              - { key: pme.css, path: resources/css/pme.css }
              - { key: messages_fr.properties, path: messages/messages_fr.properties }
              - { key: roboto-400.woff2, path: resources/fonts/roboto-latin-400-normal.woff2 }
              - { key: roboto-500.woff2, path: resources/fonts/roboto-latin-500-normal.woff2 }
              - { key: roboto-700.woff2, path: resources/fonts/roboto-latin-700-normal.woff2 }
        # Autorite locale, copiee depuis le namespace cert-manager par `make ca-configmap` : sert a verifier
        # le certificat de PostgreSQL. En entreprise, trust-manager produit et maintient cette meme ConfigMap.
        - name: ca
          configMap:
            name: pme-ca
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
