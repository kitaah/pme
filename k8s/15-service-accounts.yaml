# Un compte de service par composant : c'est lui qui donne son identite au pod dans le maillage Istio
# (spiffe://cluster.local/ns/pme/sa/<nom>), et donc ce que les politiques de k8s/17-authorization-policies.yaml
# ecrivent dans leurs regles. Avec le seul compte `default`, tous les pods partageaient la meme identite.
# `alloy` a deja le sien dans k8s/13-alloy.yaml (il lit les logs par l'API de Kubernetes, donc son jeton est monte).
# Aucun de ces comptes ne recoit de droit sur l'API de Kubernetes : le jeton n'est pas monte (comme dans chaque pod).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
automountServiceAccountToken: false
---
