# Politiques reseau (NetworkPolicy) : second filtre entre les pods, independant du maillage Istio.
# Appliquees par Calico (`minikube start --cni=calico`, voir `make minikube-up`) au niveau du reseau du cluster, avant meme
# que la connexion n'atteigne le pod. Sans plugin reseau qui les applique, ces ressources sont acceptees mais ne bloquent rien.
#
# Deux filtres complementaires :
#   - ici : l'ETIQUETTE du pod appelant (app.kubernetes.io/name), au niveau du reseau ;
#   - k8s/21-authorization-policies.yaml : l'IDENTITE cryptographique du pod appelant (compte de service), par Istio.
# Les listes d'appelants et les ports sont les memes dans les deux fichiers : a modifier ensemble.
#
# Entrees seulement : les connexions sortantes des pods ne sont pas filtrees (donc aucune regle pour le DNS).
# Refus par defaut en entree, puis une regle par composant qui nomme ses appelants.
#
# Chaque regle ouvre aussi le port 15008 aux memes appelants : en mode ambient, les connexions entre pods du maillage
# transitent par le tunnel HBONE de ztunnel sur ce port (voir docs/outils/istio.md). Sans lui, une connexion autorisee serait coupee.
# Le port 15008 n'est ouvert qu'aux appelants cites : ztunnel y applique ensuite les politiques d'Istio, port par port.
# Non filtres : les sondes de Kubernetes (le trafic du noeud vers ses propres pods est toujours autorise par Calico),
# `kubectl exec` et `kubectl port-forward`.
#
# Un nouveau composant doit etre declare ici, sinon il est injoignable (refus par defaut).
# Refuser sans regle : une politique qui selectionne tous les pods et ne declare aucune entree n'autorise rien.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# PostgreSQL : l'API, la moderation, Keycloak, Grafana et Adminer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-moderation
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adminer
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 15008 }
---
# Stockage objet (Garage) : l'API (ecriture des photos) et l'ingress Traefik, qui achemine les
# lectures du navigateur. Le service de moderation n'est pas autorise : il n'a aucune relation avec
# le stockage dans le C4. Le port d'administration (3903) n'est ouvert a personne.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-garage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-api
        # Traefik est dans un autre namespace : il est designe par celui-ci et par son etiquette.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - { protocol: TCP, port: 3900 }
        - { protocol: TCP, port: 15008 }
---
# NATS : l'API (publie) et la moderation (lit). Le port de supervision 8222 n'est ouvert a personne.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nats
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-moderation
      ports:
        - { protocol: TCP, port: 4222 }
        - { protocol: TCP, port: 15008 }
---
# RabbitMQ (branche de demonstration) : l'API (publie) et la moderation (lit). Le port 15008 est celui du tunnel du
# maillage Istio (HBONE) : sans lui, ztunnel ne pourrait pas acheminer les connexions chiffrees.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-moderation
      ports:
        - { protocol: TCP, port: 5672 }
        - { protocol: TCP, port: 15008 }
---
# Keycloak : l'ingress, l'API et la moderation (cles de verification des jetons), et le Job keycloak-admin.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pme-moderation
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak-admin
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 15008 }
---
# API : l'ingress, et Prometheus (metriques).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pme-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pme-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 15008 }
---
