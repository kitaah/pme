# Configuration de RabbitMQ (ConfigMap `rabbitmq-config`, generee par kustomize : modifier ce fichier redemarre le pod).
# Montee dans /etc/rabbitmq/conf.d/ : l'image lit tous les fichiers .conf de ce dossier.
#
# Seul le port AMQP chiffre (5671) est ouvert : le port en clair (5672) est desactive. Le certificat est celui de
# k8s/00-internal-tls.yaml (Secret `rabbitmq-tls`), signe par l'autorite locale, et il couvre `localhost` pour
# `make port-forward`. TLS 1.3 minimum, comme NATS.
#
# Le chiffrement n'exige pas de certificat des clients (verify_none) : il faudrait emettre un certificat par service.
# L'authentification se fait par identifiant et mot de passe (secret `pme-secrets`). RabbitMQ ne relit pas son
# certificat a chaud : apres un renouvellement (90 jours), `kubectl -n pme rollout restart deploy/rabbitmq`.
listeners.tcp = none
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/tls/ca.crt
ssl_options.certfile = /etc/rabbitmq/tls/tls.crt
ssl_options.keyfile = /etc/rabbitmq/tls/tls.key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
