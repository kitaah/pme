# Regles d'acces de PostgreSQL (ConfigMap `postgres-hba`, generee par kustomize : modifier ce fichier
# redemarre PostgreSQL). Passee au serveur par l'option `hba_file` (k8s/01-postgres.yaml), elle remplace
# le fichier genere par l'image, qui accepte les connexions TCP EN CLAIR.
#
# `hostssl` n'accepte que les connexions chiffrees : une connexion en clair venant d'un autre pod est refusee
# par le serveur, et pas seulement decouragee par la configuration des clients.
#
# TYPE     BASE  UTILISATEUR  ADRESSE       METHODE
# Socket Unix, interne au conteneur : utilisee par l'entrypoint de l'image (initdb, postgres-init.sh)
# et par psql dans le pod (make db-listings, make db-moderation).
local      all   all                        trust
# Boucle locale du pod : sondes de Kubernetes (pg_isready -h 127.0.0.1). Dans un pod, 127.0.0.1 n'est
# joignable que depuis ce pod : les sondes n'ont donc besoin ni de TLS ni de mot de passe.
host       all   all          127.0.0.1/32  trust
host       all   all          ::1/128       trust
# Reste du cluster : TLS obligatoire et mot de passe chiffre par SCRAM-SHA-256 (jamais en clair sur le reseau).
# Un compte par service, limite a sa base (voir postgres-init.sh) : l'API n'atteint que `pme`, la moderation que
# `moderation`, Keycloak que `keycloak`, Grafana que `grafana`. Chaque ligne est ecrite pour IPv4 puis IPv6.
hostssl    pme         pme_api         0.0.0.0/0     scram-sha-256
hostssl    pme         pme_api         ::/0          scram-sha-256
hostssl    moderation  pme_moderation  0.0.0.0/0     scram-sha-256
hostssl    moderation  pme_moderation  ::/0          scram-sha-256
hostssl    keycloak    pme_keycloak    0.0.0.0/0     scram-sha-256
hostssl    keycloak    pme_keycloak    ::/0          scram-sha-256
hostssl    grafana     pme_grafana     0.0.0.0/0     scram-sha-256
hostssl    grafana     pme_grafana     ::/0          scram-sha-256
# Tout autre essai d'un compte de service (une autre base, la base `postgres`) est refuse ici, avant meme le test
# du droit CONNECT : deux protections, pas une seule. `+pme_services` designe tous les membres du groupe.
hostssl    all         +pme_services   0.0.0.0/0     reject
hostssl    all         +pme_services   ::/0          reject
# Administration (Adminer, psql depuis un poste) : le superutilisateur, par mot de passe et TLS.
hostssl    all         all             0.0.0.0/0     scram-sha-256
hostssl    all         all             ::/0          scram-sha-256
