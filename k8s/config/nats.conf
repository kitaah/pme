# Configuration de NATS (ConfigMap `nats-config`, generee par kustomize : modifier ce fichier
# redemarre NATS). Toutes les autres options restent en ligne de commande dans k8s/02-nats.yaml :
# seuls `min_version` (TLS), `https_port` (supervision chiffree) et `max_file_store` (JetStream) n'ont pas
# d'equivalent en option, d'ou ce fichier.
#
# min_version 1.3 : le serveur refuse de negocier TLS 1.2 ou plus ancien. Sa valeur par defaut est 1.2,
# donc sans cette ligne un client ne proposant que TLS 1.2 serait accepte.
#
# Les options --tls, --tlscert et --tlskey ne sont volontairement PAS passees en ligne de commande :
# elles reconstruiraient la configuration TLS apres la lecture de ce fichier et effaceraient min_version.
# Ce bloc suffit a activer le chiffrement du port des clients (4222).
#
# Le port de supervision (8222) est servi en HTTPS : `https_port` reutilise ce meme bloc `tls` (meme certificat,
# meme version minimale). Il remplace `http_port` : NATS refuse de demarrer si les deux sont declares, d'ou l'absence
# de --http_port dans k8s/02-nats.yaml. Le certificat couvre `localhost` (voir k8s/00-internal-tls.yaml), ce qui
# permet de le consulter apres `make port-forward`.
tls {
  cert_file: "/etc/nats/tls/tls.crt"
  key_file: "/etc/nats/tls/tls.key"
  min_version: "1.3"
}

https_port: 8222

# Limite du stockage des flux JetStream (JetStream lui-meme est active par `-js` dans k8s/02-nats.yaml).
# 768M (768 000 000 octets, NATS compte en puissances de 10), sous les 1Gi du volume `nats-data` : la marge restante couvre l'index et les metadonnees.
# Sans cette limite, NATS suppose pouvoir ecrire jusqu'a 1 To et ne s'arrete qu'une fois le disque plein.
jetstream {
  max_file_store: 768M
}
