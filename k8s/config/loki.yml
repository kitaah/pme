# Configuration de Loki (ConfigMap `loki-config`, generee par kustomize :
# modifier ce fichier redemarre Loki automatiquement).
# Mode "un seul processus" : tout Loki dans un conteneur, stockage sur le volume persistant `loki-data` (monte sur /loki).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  # 24 h est le minimum accepte par Loki (Prometheus garde 6 h). Les lignes plus anciennes sont supprimees par le compactor.
  retention_period: 24h
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
# Aucune statistique d'usage envoyee a Grafana Labs (meme principe que GF_ANALYTICS_REPORTING_ENABLED dans Grafana).
analytics:
  reporting_enabled: false
