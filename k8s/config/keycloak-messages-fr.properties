# Libelles de la page de connexion « pme » (theme login), en francais : les memes mots que la maquette.
# Monte dans /opt/keycloak/themes/pme/login/messages/ (voir k8s/03-keycloak.yaml). Ils completent ceux du
# theme parent : seuls les libelles ci-dessous changent, tous les autres restent ceux de Keycloak.
#
# L'apostrophe est la typographique (U+2019, d’utilisateur) et non la droite : Keycloak formate ces
# textes comme des messages Java (MessageFormat), qui consomment l'apostrophe droite (« Nom dutilisateur »),
# doublee ou non selon le chemin que suit le texte. La typographique n'a aucun sens special : elle passe
# partout, et c'est la bonne pour le francais.
#
# Ces textes sont lus au demarrage de Keycloak, sans importer le realm : une modification se voit
# apres le redemarrage du pod. Un libelle saisi dans la console d'administration (Realm settings,
# Localization, Realm overrides) passe devant celui-ci : pour qu'il s'applique, supprimer la
# personnalisation correspondante dans la console.
usernameOrEmail=Nom d’utilisateur ou email
loginAccountTitle=Connexion
doLogIn=Se connecter
rememberMe=Se souvenir de moi
noAccount=Pas encore de compte ?
doRegister=Créer un compte
