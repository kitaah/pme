# NATS 2.14 avec JetStream (option -js) : le stockage durable des messages.
# Sans JetStream, NATS ne garde rien : un message publie alors que le service de moderation est
# arrete serait perdu. JetStream apporte le flux durable, l'acquittement manuel et la remise en file.
#
# Deux ports : 4222 pour les clients, 8222 pour la supervision HTTP (/healthz, /jsz).
# NATS n'a pas d'interface web : l'etat des flux se lit sur /jsz (voir `make queues` et `make nats`).
#
# Stockage non persistant (emptyDir) : suffisant pour le POC. Les messages survivent a l'arret du
# SERVICE DE MODERATION (ils restent dans le flux), pas a la perte du pod NATS.
#
# Connexions des clients chiffrees en TLS 1.3 exclusivement (k8s/config/nats.conf), avec un certificat
# signe par l'autorite locale (k8s/00-internal-tls.yaml). Le port de supervision 8222 reste en HTTP simple :
# il n'expose aucun message, et les sondes de Kubernetes comme `make queues` continuent de le lire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nats
          image: nats:2.14-alpine
          # Kubernetes remplace $(VAR) par la variable d'environnement du conteneur declaree ci-dessous.
          args:
            - "-js"
            - "--store_dir=/data/jetstream"
            - "--http_port=8222"
            - "--user=$(NATS_USER)"
            - "--pass=$(NATS_PASSWORD)"
            # Le chiffrement du port des clients est decrit dans k8s/config/nats.conf (certificat, cle et
            # version minimale de TLS), et non en options : `min_version` n'existe qu'en fichier.
            # Le chiffrement n'exige pas de certificat des clients (ce serait --tlsverify, et il faudrait
            # alors emettre un certificat par service). NATS ne relit pas son certificat a chaud : apres un
            # renouvellement (90 jours), redemarrer le pod (`kubectl -n pme rollout restart deploy/nats`).
            - "--config=/etc/nats/conf/nats.conf"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-username }
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: nats-password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: jetstream
              mountPath: /data/jetstream
            - name: tls
              mountPath: /etc/nats/tls
              readOnly: true
            - name: config
              mountPath: /etc/nats/conf
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: jetstream
          emptyDir: {}
        # 0440 : lisible par le proprietaire (root, qui execute nats-server dans cette image) et son groupe.
        - name: tls
          secret:
            secretName: nats-tls
            defaultMode: 0440
        - name: config
          configMap:
            name: nats-config
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
