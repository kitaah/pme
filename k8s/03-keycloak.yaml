# Keycloak 24 en mode dev, joint par l'ingress (k8s/08-ingress.yaml) sur http://keycloak.localhost, en HTTP simple.
# Le realm `pme` (roles membre / moderateur, clients pme-web et pme-cli, utilisateurs de demonstration)
# est importe au demarrage depuis le ConfigMap `keycloak-realm` (config/realm-pme.json).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      # Attend PostgreSQL avant de lancer l'application : evite les redemarrages (CrashLoopBackOff)
      # du premier demarrage, quand le service demarre plus vite que la base.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do echo 'En attente de PostgreSQL'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.0
          args:
            - start-dev
            - --import-realm
            - --db=postgres
            - --db-url=jdbc:postgresql://postgres:5432/keycloak
            # Keycloak est joint par l'ingress sur http://keycloak.localhost. --hostname-url fige
            # l'URL publique : l'emetteur (iss) des jetons vaut toujours
            # http://keycloak.localhost/realms/pme, quel que soit le chemin emprunte pour atteindre
            # Keycloak. L'API peut donc lire les cles par l'adresse interne du service sans que
            # l'emetteur change.
            - --hostname-url=http://keycloak.localhost
            # Keycloak est derriere un proxy (ingress-nginx) qui termine le HTTP : il lit les
            # en-tetes X-Forwarded-* au lieu de les ignorer.
            - --proxy=edge
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: keycloak-admin-username }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: keycloak-admin-password }
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-username }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: pme-secrets, key: db-password }
            # Limite le heap JVM (voir projet Spring : jusqu'a 800Mi observes sans limite)
            - name: JAVA_OPTS_APPEND
              value: "-Xmx384m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 150m, memory: 384Mi }
            limits: { cpu: 1000m, memory: 768Mi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          # /realms/pme repond une fois le realm importe : la sonde valide donc aussi l'import
          startupProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /realms/pme, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080