# Analyse SonarCloud du monorepo GitLab "pme" (un seul projet, quatre modules TypeScript : module commun, API, moderation, front React).
# SONAR_TOKEN (masquee) et SONAR_HOST_URL=https://sonarcloud.io sont des variables CI/CD, jamais commitees.
# L'organisation et la cle ne sont pas secretes : elles sont versionnees ici.
# Cle = <organisation>_<depot>, celle que SonarCloud propose a l'import du depot GitLab.
sonar.organization=kitaah
sonar.projectKey=kitaah_pme
sonar.projectName=La Petite Maison de l'Epouvante - POC
sonar.sources=libs/common/src,api/src,moderation-service/src,frontend/src
sonar.tests=libs/common/src,api/test,api/src,moderation-service/test,moderation-service/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/migrations/**
sonar.coverage.exclusions=**/main.ts,**/main.tsx,**/*.module.ts,**/config/**,**/*.dto.ts,**/test/**
sonar.javascript.lcov.reportPaths=libs/common/coverage/lcov.info,api/coverage/lcov.info,moderation-service/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Duplication toleree sur les migrations seulement (un schema par service). Le code commun aux deux services
# est dans libs/common : il n'y a plus d'autre exclusion.
sonar.cpd.exclusions=**/migrations/**
# Porte qualite : on attend le verdict (utilise par le job CI)
sonar.qualitygate.wait=true