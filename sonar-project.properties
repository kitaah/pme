# Analyse SonarCloud du monorepo GitLab "pme" (un seul projet, trois modules TypeScript : API, moderation, front React).
# SONAR_TOKEN (masquee) et SONAR_HOST_URL=https://sonarcloud.io sont des variables CI/CD, jamais commitees.
# L'organisation et la cle ne sont pas secretes : elles sont versionnees ici.
# Cle = <organisation>_<depot>, celle que SonarCloud propose a l'import du depot GitLab.
sonar.organization=kitaah
sonar.projectKey=kitaah_pme
sonar.projectName=La Petite Maison de l'Epouvante - POC
sonar.sources=api/src,moderation-service/src,frontend/src
sonar.tests=api/test,api/src,moderation-service/test,moderation-service/src,frontend/src
sonar.test.inclusions=**/*.spec.ts,**/*.integration-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/migrations/**
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,moderation-service/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Duplication tolerée sur les migrations et la config (deux services symetriques)
sonar.cpd.exclusions=**/migrations/**,**/config/configuration.ts
# Porte qualite : on attend le verdict (utilise par le job CI)
sonar.qualitygate.wait=true