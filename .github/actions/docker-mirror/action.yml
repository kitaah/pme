# Les images Docker Hub (postgres, nats) passent par le miroir de Google : telechargement plus rapide, sans limite de debit.
# Meme reglage que le service Docker-in-Docker de .gitlab-ci.yml. Docker est deja installe sur les runners GitHub.
name: Miroir Docker Hub
description: Declare le miroir mirror.gcr.io dans le demon Docker du runner, puis le redemarre.
runs:
  using: composite
  steps:
    - name: Declarer le miroir et redemarrer Docker
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/docker
        if [ -s /etc/docker/daemon.json ]; then
          sudo jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
        else
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json.new >/dev/null
        fi
        sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format '{{.RegistryConfig.Mirrors}}'
