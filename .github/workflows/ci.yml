# Chaine CI/CD (GitHub Actions) : equivalent de .gitlab-ci.yml, qui reste la pipeline d'origine. Memes controles, memes commandes :
# tests unitaires (api, moderation-service, libs/common, frontend), analyse SonarCloud, lint du code (ESLint, complexite,
# typage tsc, Prettier), lint YAML (yamllint), controle des Dockerfile (Hadolint), analyse des dependances et des images
# d'Istio (Trivy), tests d'integration, tests des images Docker (puis leur publication), tests de performance.
# Tous les jobs sont independants, sauf Sonar qui lit les rapports de couverture des tests unitaires.
# Pipeline limite, comme sur GitLab, a la branche principale (et au declenchement manuel).
# Differences avec GitLab : les runners GitHub ont Docker, donc pas de Docker-in-Docker ; les images sont publiees dans
# ghcr.io (GITHUB_TOKEN) et non dans le registre GitLab ; NATS est lance par une etape, car un service GitHub ne
# peut pas recevoir d'arguments de commande.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau commit annule l'execution devenue obsolete (equivalent de `interruptible` sur GitLab).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Droits minimaux : lecture du depot. Le job des images demande en plus l'ecriture dans ghcr.io.
permissions:
  contents: read

env:
  npm_config_audit: "false"
  npm_config_fund: "false"
  TRIVY_VERSION: 0.71.2
  # Base de vulnerabilites : miroir AWS en premier (la limite de debit de ghcr.io fait echouer des scans).
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
  TRIVY_NO_PROGRESS: "true"
  TRIVY_SKIP_VERSION_CHECK: "true"

jobs:
  # ---------- Tests unitaires : un job par module, execute en parallele ----------
  # Chaque job publie son rapport de tests (JUnit) et sa couverture (lcov, lue ensuite par Sonar).
  # Les seuils de couverture sont dans jest.config.js et vite.config.ts : le job echoue s'ils ne sont pas atteints.
  unit-tests:
    name: unit-tests:${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: libs/common, slug: common, args: "--reporters=default --reporters=jest-junit" }
          - { module: api, slug: api, args: "--reporters=default --reporters=jest-junit" }
          - { module: moderation-service, slug: moderation-service, args: "--reporters=default --reporters=jest-junit" }
          - { module: frontend, slug: frontend, args: "--reporter=default --reporter=junit --outputFile.junit=reports/junit.xml" }
    env:
      MODULE: ${{ matrix.module }}
      JEST_JUNIT_OUTPUT_DIR: reports
      JEST_JUNIT_OUTPUT_NAME: junit.xml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.module == 'frontend' && 'frontend/package-lock.json' || 'package-lock.json' }}
      # api, moderation-service et libs/common sont des workspaces npm : un seul npm ci, a la racine.
      # Le frontend a son propre package.json. Les modules qui dependent de @pme/common le compilent via "pretest:cov".
      - name: Installer les dependances
        run: |
          if [ "$MODULE" = "frontend" ]; then
            (cd frontend && npm ci --prefer-offline)
          else
            npm ci --prefer-offline --workspace="$MODULE" --workspace=libs/common
          fi
      - name: Tests unitaires et couverture
        working-directory: ${{ matrix.module }}
        run: npm run test:cov -- ${{ matrix.args }}
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.slug }}
          path: ${{ matrix.module }}/reports/junit.xml
          if-no-files-found: warn
          retention-days: 7
      # Uniquement le fichier utile : le rapport HTML de lcov compte des centaines de fichiers.
      - name: Publier la couverture
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.slug }}
          path: ${{ matrix.module }}/coverage/lcov.info
          retention-days: 7

  # ---------- Analyse SonarCloud : qualite et securite du code, couverture des tests unitaires ----------
  # Lit les rapports de couverture des tests unitaires et attend la porte qualite (sonar.qualitygate.wait) : bloquant.
  # Secret a definir dans le depot (Settings > Secrets and variables > Actions) : SONAR_TOKEN.
  # L'offre gratuite de SonarCloud n'analyse que la branche principale.
  sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet : Sonar en a besoin pour reperer le « nouveau code »
      - uses: actions/download-artifact@v4
        with:
          name: lcov-common
          path: libs/common/coverage
      - uses: actions/download-artifact@v4
        with:
          name: lcov-api
          path: api/coverage
      - uses: actions/download-artifact@v4
        with:
          name: lcov-moderation-service
          path: moderation-service/coverage
      - uses: actions/download-artifact@v4
        with:
          name: lcov-frontend
          path: frontend/coverage
      # Les rapports lcov nomment les fichiers depuis leur module (src/...) : Sonar, lui, part de la racine du depot.
      - name: Corriger les chemins des rapports lcov
        run: |
          for module in libs/common api moderation-service frontend; do
            sed -i "s#^SF:src/#SF:${module}/src/#" "${module}/coverage/lcov.info"
          done
      - name: Analyse SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Le secret SONAR_TOKEN n'est pas defini dans le depot GitHub." >&2
            exit 1
          fi
          docker run --rm -e SONAR_TOKEN -e SONAR_HOST_URL=https://sonarcloud.io \
            -v "$GITHUB_WORKSPACE:/usr/src" sonarsource/sonar-scanner-cli:11

  # ---------- Lint du code : ESLint (complexite cyclomatique <= 10 et cognitive <= 15), typage strict (tsc), Prettier ----------
  # Memes controles que `make lint` et `make format-check`. Un job par module, en parallele.
  lint-code:
    name: lint:code (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        module: [libs/common, api, moderation-service, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.module == 'frontend' && 'frontend/package-lock.json' || 'package-lock.json' }}
      - name: Installer les dependances
        env:
          MODULE: ${{ matrix.module }}
        run: |
          if [ "$MODULE" = "frontend" ]; then
            (cd frontend && npm ci --prefer-offline)
          else
            npm ci --prefer-offline --workspace="$MODULE" --workspace=libs/common
          fi
      - name: ESLint, complexite et tsc
        working-directory: ${{ matrix.module }}
        run: npm run lint
      - name: Prettier
        working-directory: ${{ matrix.module }}
        run: npm run format:check

  # ---------- Lint YAML : manifestes Kubernetes, tests d'image, pipelines (la documentation MkDocs n'est pas analysee) ----------
  # Regles dans .yamllint.yml, partage avec `make lint-yaml`. Version epinglee.
  lint-yaml:
    name: lint:yaml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer yamllint
        run: pip install --no-cache-dir "yamllint==${YAMLLINT_VERSION}"
      - name: yamllint
        run: |
          yamllint --version
          yamllint -c .yamllint.yml k8s tests .gitlab-ci.yml .github .yamllint.yml

  # ---------- Controle des Dockerfile : Hadolint (linter, sans construction d'image) ----------
  # Regles et seuil d'echec (warning) definis dans .hadolint.yaml, partage avec `make lint-docker`.
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HADOLINT_VERSION: 2.14.0
      HADOLINT_SHA256: 6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Hadolint : version epinglee et binaire verifie par sa somme de controle (SHA-256) avant installation.
      - name: Installer Hadolint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Hadolint
        run: |
          hadolint --version
          hadolint --config .hadolint.yaml --no-color api/Dockerfile moderation-service/Dockerfile frontend/Dockerfile docker/docs/Dockerfile

  # ---------- Analyse des dependances : failles connues dans les fichiers package-lock.json (Trivy) ----------
  # Complete l'analyse des images : celle-ci lit aussi les devDependencies. HIGH et CRITICAL, failles corrigeables seulement,
  # exceptions dans .trivyignore.
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # 1. Analyse du depot : package-lock.json de la racine (api, moderation-service, libs/common) et du frontend.
      - name: Analyse du depot
        run: trivy fs --scanners vuln --include-dev-deps --severity HIGH,CRITICAL --ignore-unfixed --format json --output trivy-dependencies.json --exit-code 0 .
      # 2. Lecture du rapport : tableau dans le log, et echec s'il reste une faille HIGH ou CRITICAL non justifiee (.trivyignore).
      - name: Lecture du rapport
        run: trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 trivy-dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-dependencies
          path: trivy-dependencies.json
          retention-days: 7

  # ---------- Analyse des images d'Istio : failles connues dans istiod, istio-cni et ztunnel (Trivy) ----------
  # Ces images sont publiees par Istio : le correctif d'une faille vient d'une nouvelle version d'Istio. Le job bloque donc sur
  # les failles CRITICAL corrigeables, et signale les HIGH. La version d'Istio est lue dans le Makefile (ISTIO_VERSION).
  istio-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Lire la version d'Istio
        run: |
          ISTIO_VERSION=$(sed -n 's/^ISTIO_VERSION ?= *//p' Makefile)
          test -n "$ISTIO_VERSION"
          echo "ISTIO_VERSION=$ISTIO_VERSION" >> "$GITHUB_ENV"
      # 1. Analyse des trois images (HIGH et CRITICAL corrigeables), un rapport JSON par image, sans echec a ce stade.
      - name: Analyse des images
        run: |
          for img in pilot install-cni ztunnel; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-istio-$img.json" --exit-code 0 "docker.io/istio/$img:$ISTIO_VERSION"
          done
      # 2. Nombre de failles HIGH par image : information, pas un echec.
      - name: Nombre de failles HIGH
        run: |
          for img in pilot install-cni ztunnel; do
            echo "$img:$ISTIO_VERSION : $(grep -c '"Severity": "HIGH"' "trivy-istio-$img.json" || true) failles HIGH corrigeables (voir le rapport trivy-istio-$img.json)"
          done
      # 3. Echec s'il reste une faille CRITICAL corrigeable non justifiee (.trivyignore).
      - name: Echec sur les failles CRITICAL
        run: |
          failed=""
          for img in pilot install-cni ztunnel; do
            trivy convert --format table --severity CRITICAL --exit-code 1 "trivy-istio-$img.json" || failed=1
          done
          test -z "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-istio
          path: |
            trivy-istio-pilot.json
            trivy-istio-install-cni.json
            trivy-istio-ztunnel.json
          retention-days: 7

  # ---------- Tests d'integration : PostgreSQL et NATS (JetStream) reels, lances par Testcontainers ----------
  # Les runners GitHub ont deja un demon Docker : pas de Docker-in-Docker, les conteneurs de test sont sur localhost.
  # Un seul job pour l'API et la moderation. Les deux modules sont testes meme si le premier echoue, puis le job echoue
  # si l'un d'eux a echoue.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JEST_JUNIT_OUTPUT_DIR: reports
      JEST_JUNIT_OUTPUT_NAME: junit-integration.xml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/docker-mirror
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Installer les dependances
        run: npm ci --prefer-offline --workspace=api --workspace=moderation-service --workspace=libs/common
      - name: Tests d'integration
        run: |
          status=0
          for module in api moderation-service; do
            (cd "$module" && npm run test:integration -- --forceExit --reporters=default --reporters=jest-junit) || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: |
            api/reports/junit-integration.xml
            moderation-service/reports/junit-integration.xml
          if-no-files-found: warn
          retention-days: 7

  # ---------- Tests des images Docker : construction, structure (container-structure-test), vulnerabilites (Trivy), publication ----------
  # Un seul job : les trois images sont construites en parallele (docker-bake.hcl), puis la structure et les vulnerabilites sont
  # controlees. Memes controles que "make image-test". Publication dans ghcr.io en derniere etape : seulement si tous les
  # controles ont reussi et seulement sur la branche principale. Une image n'est donc jamais publiee sans avoir ete controlee.
  # Pas de nouvelle construction : ce sont les images deja testees. Le cache de couches (registre) en limite la duree.
  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      packages: write
    env:
      CST_VERSION: v1.19.3
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivycache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: ./.github/actions/docker-mirror
      # Builder docker-container : exige par le cache de couches dans le registre (voir docker-bake.hcl).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Les noms d'image doivent etre en minuscules : on les calcule une fois pour toutes les etapes.
      - name: Calculer les noms d'image
        run: |
          repo=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY_REPO=$repo" >> "$GITHUB_ENV"
          echo "CACHE_REPO=$repo/cache" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          echo "TAG=ci-${GITHUB_SHA::8}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-trivy
        with:
          version: ${{ env.TRIVY_VERSION }}
      # container-structure-test : version epinglee, binaire verifie par sa somme de controle (SHA-256).
      - name: Installer container-structure-test
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}"
          curl -sSfLO "$base/container-structure-test-linux-amd64"
          curl -sSfLO "$base/checksums.txt"
          grep " container-structure-test-linux-amd64\$" checksums.txt | sha256sum -c -
          install -m 0755 container-structure-test-linux-amd64 "$RUNNER_TEMP/bin/cst"
      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # 1. Construction des trois images en parallele, avec le cache de couches du registre. `--load` ramene les images dans
      #    le Docker du job. La base Trivy se telecharge en arriere-plan pendant la construction.
      - name: Construire les images
        run: |
          trivy image --download-db-only > trivy-db.log 2>&1 & db_pid=$!
          docker buildx bake --load
          wait "$db_pid" || { cat trivy-db.log; exit 1; }
      # 2. Structure de chaque image : les trois controles tournent en parallele ; l'etape echoue si l'un d'eux echoue.
      - name: Structure des images
        run: |
          for svc in api moderation frontend; do
            cst test --image "pme-$svc:$TAG" --config "tests/image/$svc.yaml" > "cst-$svc.log" 2>&1 & echo $! > "cst-$svc.pid"
          done
          status=0
          for svc in api moderation frontend; do
            wait "$(cat "cst-$svc.pid")" || status=1
            echo "== structure pme-$svc"; cat "cst-$svc.log"
          done
          test "$status" -eq 0
      # 3. Vulnerabilites : base deja telechargee, puis les trois analyses en parallele (paquets uniquement, failles sans
      #    correctif ignorees). Un rapport JSON par image est conserve.
      - name: Analyse des vulnerabilites
        run: |
          printf '%s\n' api moderation frontend | xargs -P 3 -I{} trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --format json --output "trivy-{}.json" --exit-code 0 "pme-{}:$TAG"
      # 4. Lecture des rapports : tableau dans le log, et echec s'il reste une faille HIGH ou CRITICAL non justifiee (.trivyignore).
      - name: Lecture des rapports
        run: |
          status=0
          for svc in api moderation frontend; do
            echo "== pme-$svc"
            trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 "trivy-$svc.json" || status=1
          done
          test "$status" -eq 0
      # 5. Publication dans ghcr.io (branche principale uniquement). Etiquette immuable : le commit (pas de "latest").
      #    Les trois envois se font en parallele.
      - name: Publier les images
        if: github.ref == 'refs/heads/main'
        run: |
          for svc in api moderation frontend; do
            docker tag "pme-$svc:$TAG" "$REGISTRY_REPO/$svc:$SHORT_SHA"
          done
          printf '%s\n' api moderation frontend | xargs -P 3 -I{} docker push "$REGISTRY_REPO/{}:$SHORT_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-images
          path: trivy-*.json
          retention-days: 7

  # ---------- Tests de performance : l'API reelle, PostgreSQL et NATS, mesures par k6 ----------
  # Pas de Keycloak : un faux fournisseur d'identite signe le jeton (voir scripts/perf-ci.sh, le meme script que sur GitLab).
  # PostgreSQL est un service du job ; NATS est lance par une etape (un service GitHub ne recoit pas d'arguments de commande :
  # il faut `-js --user pme --pass ci`). Les deux sont joints sur localhost. Le test echoue si un seuil k6 est depasse
  # (tests/performance/load.js). La charge complete (20 utilisateurs, Keycloak reel) reste a lancer sur la recette.
  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K6_VERSION: 1.4.0
      # Configuration de l'API (valeurs jetables : les services disparaissent avec le job)
      DB_HOST: localhost
      DB_NAME: pme
      DB_USER: pme
      DB_PASSWORD: ci
      NATS_HOST: localhost
      NATS_USER: pme
      NATS_PASSWORD: ci
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: pme
          POSTGRES_USER: pme
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pme -d pme"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # JetStream active, avec les identifiants de NATS_USER et NATS_PASSWORD ci-dessus.
      - name: Demarrer NATS
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.14-alpine -js --user pme --pass ci
          timeout 30 bash -c 'until (echo > /dev/tcp/localhost/4222) 2>/dev/null; do sleep 1; done'
      # k6 : version epinglee et archive verifiee par sa somme de controle (SHA-256) avant installation.
      - name: Installer k6
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          base="https://github.com/grafana/k6/releases/download/v${K6_VERSION}"
          archive="k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/k6-v${K6_VERSION}-checksums.txt"
          grep " $archive\$" "k6-v${K6_VERSION}-checksums.txt" | sha256sum -c -
          tar -xzf "$archive"
          install -m 0755 "k6-v${K6_VERSION}-linux-amd64/k6" "$RUNNER_TEMP/bin/k6"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Test de performance
        run: sh scripts/perf-ci.sh
      # Sans token.txt : le jeton de test n'a rien a faire dans un artefact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: |
            perf-results/summary.json
            perf-results/api.log
            perf-results/environment.log
          if-no-files-found: warn
          retention-days: 7

  # ---------- Verdict : un seul controle a exiger dans la protection de branche ----------
  # Echoue si l'un des jobs ci-dessus a echoue ou a ete annule.
  ci-ok:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - unit-tests
      - sonar
      - lint-code
      - lint-yaml
      - hadolint
      - dependency-scan
      - istio-scan
      - integration-tests
      - image-tests
      - performance-tests
    steps:
      - name: Verifier le resultat de tous les jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultats : $RESULTS"
          for result in $RESULTS; do
            test "$result" = "success" || { echo "Au moins un job n'a pas reussi." >&2; exit 1; }
          done
